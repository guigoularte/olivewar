<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oliver - Recados dos clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',system-ui,sans-serif}</style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, limit, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const corDe = (nome) => { const cores = ["#4f46e5", "#0d9488", "#be185d", "#b45309", "#7c3aed", "#0369a1", "#ea580c"]; let h = 0; for (const c of (nome || "?")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return cores[h % cores.length]; };
        const quando = (iso) => { try { const d = new Date(iso); const hoje = new Date(); const sameDay = d.toDateString() === hoje.toDateString(); return (sameDay ? "Hoje " : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " ") + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };

        let empresaId = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { location.href = "login.html"; return; }
            const u = (await getDoc(doc(db, "usuarios", user.uid))).data() || {};
            const ehEquipe = u.role === "master" || u.role === "empresa_admin" || (u.funcionalidades && u.funcionalidades.relatorios === true);
            empresaId = u.empresaId || null;
            if (!ehEquipe || !empresaId) {
                document.getElementById("lista").innerHTML = `<div class="text-center text-slate-400 text-sm py-10">Os recados dos clientes são visíveis apenas para a equipe da consultoria.</div>`;
                return;
            }
            const q = query(collection(db, "empresas", empresaId, "recados"), orderBy("criadoEm", "desc"), limit(100));
            onSnapshot(q, (snap) => render(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                (err) => { document.getElementById("lista").innerHTML = `<div class="text-center text-rose-500 text-sm py-10">Erro: ${esc(err.message)}<br><span class="text-xs text-slate-400">As regras do Firestore foram publicadas?</span></div>`; });
        });

        function render(recados) {
            const naoLidas = recados.filter(r => !r.lida).length;
            const sub = document.getElementById("sub");
            if (sub) sub.textContent = recados.length + " recado(s)" + (naoLidas ? " · " + naoLidas + " novo(s)" : "");
            const lista = document.getElementById("lista");
            if (!recados.length) { lista.innerHTML = `<div class="text-center text-slate-400 text-sm py-12"><i class="fa-regular fa-comments text-3xl mb-2 block"></i>Nenhum recado ainda.<br>Quando um cliente escrever no app, aparece aqui.</div>`; return; }
            lista.innerHTML = recados.map(r => `
                <div class="bg-white rounded-2xl border ${r.lida ? "border-slate-200" : "border-orange-300 ring-1 ring-orange-100"} shadow-sm p-4 mb-3">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0" style="background:${corDe(r.clienteNome)}">${esc((r.clienteNome || "?")[0].toUpperCase())}</div>
                        <div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-800 truncate">${esc(r.clienteNome || "Cliente")}</p>
                        <p class="text-[11px] text-slate-400">${quando(r.criadoEm)}</p></div>
                        ${r.lida ? "" : `<span class="text-[9px] font-bold uppercase bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">novo</span>`}
                    </div>
                    <p class="text-[14px] text-slate-700 whitespace-pre-wrap break-words">${esc(r.texto)}</p>
                    ${r.lida ? "" : `<div class="text-right mt-2"><button data-lido="${r.id}" class="text-[11px] font-bold text-slate-500 hover:text-emerald-600"><i class="fa-regular fa-circle-check"></i> Marcar como lido</button></div>`}
                </div>`).join("");
            lista.querySelectorAll("[data-lido]").forEach(b => b.addEventListener("click", async () => {
                try { await updateDoc(doc(db, "empresas", empresaId, "recados", b.getAttribute("data-lido")), { lida: true }); } catch (e) { alert("Erro: " + e.message); }
            }));
        }
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-slate-50 min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col overflow-hidden">
        <header class="bg-orange-600 text-white px-4 py-3 shrink-0 shadow-md flex items-center gap-3">
            <a href="app.html" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/15"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="flex-1">
                <h1 class="font-bold text-base leading-none">Recados dos clientes</h1>
                <p id="sub" class="text-[11px] text-orange-100 mt-0.5">Relatos e pedidos enviados pelo app</p>
            </div>
            <i class="fa-solid fa-comment-dots text-orange-200"></i>
        </header>
        <main id="lista" class="flex-1 overflow-y-auto p-3.5" style="-webkit-overflow-scrolling:touch">
            <div class="text-center text-slate-400 text-sm py-10">Carregando…</div>
        </main>
    </div>
    <script src="oliver_ui.js"></script>
</body>
</html>
