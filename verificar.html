<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Verificar Relatório</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, getDoc, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioAtual = null, nomeFuncionario = "", clientesPermitidos = [], minhaEmpresa = null;
        let basePath = null, itens = [];

        const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const dataFmt = (iso) => iso ? new Date(iso).toLocaleString("pt-BR") : "";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            usuarioAtual = user;
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const dados = snap.exists() ? snap.data() : {};
            const permitido = dados.role === "master" || (dados.funcionalidades && dados.funcionalidades.relatorios);
            if (!permitido) { alert("Esta funcionalidade é para consultores."); window.location.href = "app.html"; return; }
            nomeFuncionario = dados.nome || user.email;
            clientesPermitidos = (dados.role === "master") ? [] : (dados.clientesPermitidos || []);
            minhaEmpresa = dados.empresaId || null;
            document.getElementById('conteudo').classList.remove('hidden');
            await carregarDestinos();
        });

        async function carregarDestinos() {
            const select = document.getElementById('destino');
            try {
                if (minhaEmpresa) {
                    const osnap = await getDocs(query(collection(db, "organizacoes"), where("empresaId", "==", minhaEmpresa)));
                    osnap.forEach(o => { const opt = document.createElement('option'); opt.value = "org:" + o.id; opt.textContent = "🏢 " + (o.data().nome || "(organização)"); select.appendChild(opt); });
                }
                const snap = await getDocs(collection(db, "usuarios"));
                snap.forEach(d => {
                    if (d.id === usuarioAtual.uid) return;
                    const u = d.data();
                    if (u.role === "master") return;
                    if (clientesPermitidos.length && !clientesPermitidos.includes(d.id)) return;
                    const opt = document.createElement('option'); opt.value = d.id; opt.textContent = `${u.nome || "(sem nome)"} — ${u.email || ""}`; select.appendChild(opt);
                });
            } catch (e) { alert("Erro ao carregar destinos: " + e.message); }
        }

        window.carregarItens = async () => {
            const v = document.getElementById('destino').value;
            const lista = document.getElementById('lista');
            if (!v) { lista.innerHTML = '<p class="text-sm text-slate-400 text-center mt-8">Escolha um cliente ou organização.</p>'; return; }
            basePath = v.startsWith("org:") ? ["organizacoes", v.slice(4)] : ["usuarios", v];
            lista.innerHTML = '<p class="text-sm text-slate-400 text-center mt-8">Carregando...</p>';
            try {
                const s = await getDocs(collection(db, basePath[0], basePath[1], "itens_resolver"));
                itens = s.docs.map(d => ({ id: d.id, ...d.data() }));
                // pendentes primeiro, depois por data
                itens.sort((a, b) => ((a.status === "concluido") - (b.status === "concluido")) || (b.data || "").localeCompare(a.data || ""));
                render();
            } catch (e) { lista.innerHTML = '<p class="text-sm text-red-500 text-center mt-8">Erro ao carregar itens: ' + esc(e.message) + '</p>'; }
        };

        function render() {
            const lista = document.getElementById('lista');
            if (itens.length === 0) { lista.innerHTML = '<p class="text-sm text-slate-400 text-center mt-8">Nenhum item para este cliente.</p>'; return; }
            const pend = itens.filter(i => i.status !== "concluido").length;
            document.getElementById('contador').innerText = itens.length + " item(ns) · " + pend + " pendente(s)";
            lista.innerHTML = itens.map(it => {
                const feito = it.status === "concluido";
                return `<div class="bg-white p-3 rounded-2xl shadow-sm border ${feito ? 'border-green-300' : 'border-slate-200'} mb-3">
                    <div class="flex justify-between items-start gap-2 mb-1">
                        <p class="text-sm font-semibold text-slate-800 flex-1">${esc(it.descricao || "")}</p>
                        ${feito ? '<span class="text-[10px] font-bold text-green-600 bg-green-50 px-2 py-1 rounded shrink-0">FEITO</span>' : '<span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded shrink-0">PENDENTE</span>'}
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <div>
                            <div class="text-[10px] font-semibold text-slate-400 mb-1">Antes</div>
                            ${it.fotoAntes ? `<img src="${it.fotoAntes}" class="rounded-lg w-full h-28 object-cover">` : '<div class="h-28 rounded-lg bg-slate-50 border border-dashed border-slate-200 flex items-center justify-center text-[10px] text-slate-300">sem foto</div>'}
                        </div>
                        <div>
                            <div class="text-[10px] font-semibold text-green-600 mb-1">Depois</div>
                            ${it.fotoDepois ? `<img src="${it.fotoDepois}" class="rounded-lg w-full h-28 object-cover">` : '<div class="h-28 rounded-lg bg-slate-50 border border-dashed border-slate-200 flex items-center justify-center text-[10px] text-slate-300">sem foto</div>'}
                        </div>
                    </div>
                    ${it.verificadoPor ? `<div class="text-[10px] text-slate-400 mt-1">Verificado por ${esc(it.verificadoPor)}${it.resolvidoEm ? " · " + dataFmt(it.resolvidoEm) : ""}</div>` : ""}
                    <div class="flex gap-2 mt-2">
                        <label class="flex-1 text-center bg-slate-100 text-slate-700 text-xs font-semibold py-2 rounded-lg cursor-pointer hover:bg-slate-200">
                            📷 ${it.fotoDepois ? "Trocar foto depois" : "Foto depois"}
                            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="enviarDepois('${it.id}', this)">
                        </label>
                        ${feito
                            ? `<button onclick="marcar('${it.id}','pendente')" class="flex-1 bg-amber-50 text-amber-700 text-xs font-semibold py-2 rounded-lg hover:bg-amber-100">↺ Reabrir</button>`
                            : `<button onclick="marcar('${it.id}','concluido')" class="flex-1 bg-green-600 text-white text-xs font-semibold py-2 rounded-lg hover:bg-green-700">✓ Marcar feito</button>`}
                    </div>
                </div>`;
            }).join('');
        }

        function comprimirImagem(file, maxLado = 900, qualidade = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > height && width > maxLado) { height = height * maxLado / width; width = maxLado; }
                        else if (height > maxLado) { width = width * maxLado / height; height = maxLado; }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', qualidade));
                    };
                    img.onerror = reject; img.src = e.target.result;
                };
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

        const itRef = (id) => doc(db, basePath[0], basePath[1], "itens_resolver", id);

        window.enviarDepois = async (id, input) => {
            const arq = input.files[0]; if (!arq) return;
            try {
                const foto = await comprimirImagem(arq);
                await updateDoc(itRef(id), { fotoDepois: foto, status: "concluido", resolvidoEm: new Date().toISOString(), verificadoPor: nomeFuncionario });
                await carregarItens();
            } catch (e) { alert("Erro ao enviar foto: " + e.message); }
        };

        window.marcar = async (id, status) => {
            try {
                const patch = { status };
                if (status === "concluido") { patch.resolvidoEm = new Date().toISOString(); patch.verificadoPor = nomeFuncionario; }
                await updateDoc(itRef(id), patch);
                await carregarItens();
            } catch (e) { alert("Erro: " + e.message); }
        };
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col p-6 overflow-hidden">
        <div id="conteudo" class="hidden overflow-y-auto flex-1">
            <div class="flex items-center justify-between mb-3">
                <a href="relatorios.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-base font-black text-blue-950">Verificar Relatório</h1>
                <div class="w-8"></div>
            </div>
            <p class="text-[11px] text-slate-500 mb-2">Selecione o cliente/organização e registre o que foi feito, com a <b>foto depois</b> (antes e depois).</p>

            <label class="text-xs font-semibold text-slate-600">Cliente / Organização</label>
            <select id="destino" onchange="carregarItens()" class="w-full mt-1 mb-2 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Selecione…</option>
            </select>
            <p id="contador" class="text-[11px] text-slate-500 mb-2"></p>

            <div id="lista"></div>
        </div>
    </div>
</body>
</html>
