<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Checklist de Boas Práticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="oliver_pdf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>emailjs.init({ publicKey: "Jwl7iLqUNND6syxRU" });</script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, getDocs, getDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // Persistência offline: grava no aparelho e sincroniza quando a internet voltar
        const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

        const EMAIL_SERVICE = "service_yuf3qik";
        const EMAIL_TEMPLATE = "template_r7hf9fm";

        let usuarioAtual = null, nomeFuncionario = "", checklist = [], clientesPermitidos = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            usuarioAtual = user;
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const dados = snap.exists() ? snap.data() : {};
            const permitido = dados.role === "master" || (dados.funcionalidades && dados.funcionalidades.relatorios);
            if (!permitido) { alert("Esta funcionalidade não está disponível no seu plano."); window.location.href = "app.html"; return; }
            nomeFuncionario = dados.nome || user.email;
            clientesPermitidos = (dados.role === "master") ? [] : (dados.clientesPermitidos || []);
            document.getElementById('conteudo').classList.remove('hidden');
            carregarClientes();
            carregarChecklist();
        });

        async function carregarClientes() {
            const select = document.getElementById('cliente');
            try {
                const snap = await getDocs(collection(db, "usuarios"));
                snap.forEach((d) => {
                    if (d.id === usuarioAtual.uid) return;
                    const u = d.data();
                    if (u.role === "master") return;
                    if (clientesPermitidos.length && !clientesPermitidos.includes(d.id)) return;
                    const opt = document.createElement('option');
                    opt.value = d.id; opt.textContent = `${u.nome || "(sem nome)"} — ${u.email || ""}`;
                    select.appendChild(opt);
                });
            } catch (err) { /* silencioso */ }
        }

        async function carregarChecklist() {
            try {
                const resp = await fetch('checklist_data.json');
                checklist = await resp.json();
            } catch (e) {
                document.getElementById('secoes').innerHTML = '<p class="text-sm text-red-500">Erro ao carregar o checklist.</p>';
                return;
            }
            renderChecklist();
        }

        function renderChecklist() {
            const cont = document.getElementById('secoes');
            cont.innerHTML = '';
            checklist.forEach((sec, si) => {
                let itensHtml = '';
                sec.subs.forEach((sub) => {
                    itensHtml += `<div class="mt-3"><div class="text-xs font-bold text-blue-800 uppercase tracking-wide mb-1">${sub.titulo}</div>`;
                    sub.itens.forEach((it) => {
                        itensHtml += `<div class="py-2 border-b border-slate-100">
                            <p class="text-[13px] text-slate-700 mb-1"><span class="text-slate-400">${it.codigo}</span> ${it.texto}</p>
                            <div class="flex gap-1">
                                ${['Sim','Não','NA'].map(op => `
                                    <label class="flex-1 text-center text-[11px] font-semibold py-1 rounded-lg border cursor-pointer opcao">
                                        <input type="radio" name="i_${it.codigo}" value="${op}" class="hidden" onchange="marcar(this)">
                                        <span>${op}</span>
                                    </label>`).join('')}
                            </div>
                        </div>`;
                    });
                    itensHtml += `</div>`;
                });
                cont.innerHTML += `<div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 mb-3">
                    <h3 class="font-black text-slate-800 text-sm">${sec.titulo}</h3>
                    ${itensHtml}
                    <div class="mt-3">
                        <label class="text-xs font-semibold text-slate-600">Observações (${sec.titulo})</label>
                        <textarea id="obs_${si}" rows="2" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>`;
            });
            atualizarResumo();
        }

        // Destaca a opção marcada
        window.marcar = (input) => {
            const grupo = document.getElementsByName(input.name);
            grupo.forEach(r => {
                const lbl = r.closest('.opcao');
                lbl.classList.remove('bg-green-500','bg-red-500','bg-slate-400','text-white','border-transparent');
                lbl.classList.add('border-blue-950','text-slate-600');
            });
            const lbl = input.closest('.opcao');
            lbl.classList.remove('border-blue-950','text-slate-600');
            const cor = input.value === 'Sim' ? 'bg-green-500' : input.value === 'Não' ? 'bg-red-500' : 'bg-slate-400';
            lbl.classList.add(cor,'text-white','border-transparent');
            atualizarResumo();
        };

        function coletar() {
            const respostas = {};
            let sim = 0, nao = 0, na = 0;
            checklist.forEach(sec => sec.subs.forEach(sub => sub.itens.forEach(it => {
                const sel = document.querySelector(`input[name="i_${it.codigo}"]:checked`);
                const v = sel ? sel.value : "";
                respostas[it.codigo] = v;
                if (v === 'Sim') sim++; else if (v === 'Não') nao++; else if (v === 'NA') na++;
            })));
            const observacoes = {};
            checklist.forEach((sec, si) => { const t = document.getElementById(`obs_${si}`).value.trim(); if (t) observacoes[sec.titulo] = t; });
            return { respostas, observacoes, sim, nao, na };
        }

        function atualizarResumo() {
            const { sim, nao, na } = coletar();
            document.getElementById('resumo').innerText = `Conforme: ${sim} · Não conforme: ${nao} · N/A: ${na}`;
        }

        function gerarPDF(clienteNome, dados) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            let y = oliverPdfHeader(pdf, "Checklist RDC 275", clienteNome || "");
            pdf.setFontSize(10); pdf.setTextColor(0, 0, 0);
            pdf.text(`Cliente: ${clienteNome}`, 14, y); y += 5;
            pdf.text(`Funcionário: ${nomeFuncionario}`, 14, y); y += 5;
            pdf.text(`Data: ${new Date().toLocaleString("pt-BR")}`, 14, y); y += 5;
            pdf.text(`Conforme: ${dados.sim}  |  Não conforme: ${dados.nao}  |  N/A: ${dados.na}`, 14, y); y += 8;

            checklist.forEach((sec, si) => {
                if (y > 275) { pdf.addPage(); y = 18; }
                pdf.setFontSize(11); pdf.setTextColor(23, 37, 84);
                pdf.text(sec.titulo, 14, y); y += 6;
                pdf.setFontSize(8); pdf.setTextColor(0, 0, 0);
                sec.subs.forEach(sub => sub.itens.forEach(it => {
                    const v = dados.respostas[it.codigo] || "-";
                    const linha = pdf.splitTextToSize(`${it.codigo} [${v}] ${it.texto}`, 182);
                    if (y + linha.length * 4 > 285) { pdf.addPage(); y = 18; }
                    if (v === 'Não') pdf.setTextColor(200, 0, 0); else pdf.setTextColor(60, 60, 60);
                    pdf.text(linha, 14, y); y += linha.length * 4 + 1;
                }));
                const obs = dados.observacoes[sec.titulo];
                if (obs) { pdf.setTextColor(0,0,120); const l = pdf.splitTextToSize(`Obs: ${obs}`, 182); if (y + l.length*4 > 285){pdf.addPage();y=18;} pdf.text(l, 14, y); y += l.length*4 + 2; }
                y += 2;
            });
            oliverPdfFooter(pdf);
            return pdf;
        }

        async function compartilharPDF(pdf, nomeArq, texto) {
            try {
                const blob = pdf.output("blob");
                const file = new File([blob], nomeArq, { type: "application/pdf" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: "Checklist", text: texto }); return;
                }
            } catch (e) { console.log(e); }
            pdf.save(nomeArq);
        }

        async function enviarEmail(clienteNome, dados) {
            const naoConf = [];
            checklist.forEach(sec => sec.subs.forEach(sub => sub.itens.forEach(it => {
                if (dados.respostas[it.codigo] === 'Não') naoConf.push(`${it.codigo} ${it.texto}`);
            })));
            const conteudo = `Conforme: ${dados.sim} | Não conforme: ${dados.nao} | N/A: ${dados.na}\n\nNÃO CONFORMES:\n` + (naoConf.join("\n") || "Nenhum");
            try {
                await emailjs.send(EMAIL_SERVICE, EMAIL_TEMPLATE, {
                    tipo_relatorio: "Checklist de Boas Práticas (RDC 275)",
                    funcionario: nomeFuncionario, cliente: clienteNome, conteudo,
                    data: new Date().toLocaleString("pt-BR")
                });
            } catch (e) { console.error("Falha e-mail:", e); }
        }

        window.salvar = async () => {
            const select = document.getElementById('cliente');
            const clienteId = select.value;
            const clienteNome = clienteId ? select.options[select.selectedIndex].text : "(sem cliente)";
            const dados = coletar();
            if (dados.sim + dados.nao + dados.na === 0) { alert("Marque pelo menos um item do checklist."); return; }

            const btn = document.getElementById('btn-salvar');
            btn.disabled = true; btn.innerText = "Salvando...";
            try {
                const gravacao = addDoc(collection(db, "usuarios", usuarioAtual.uid, "relatorios_enviados"), {
                    tipo: "checklist", funcionario: nomeFuncionario, clienteId: clienteId || "", clienteNome,
                    resumo: { sim: dados.sim, nao: dados.nao, na: dados.na },
                    respostas: dados.respostas, observacoes: dados.observacoes,
                    data: new Date().toISOString()
                });
                const pdf = gerarPDF(clienteNome, dados);
                await compartilharPDF(pdf, "checklist-boas-praticas.pdf", `Checklist - ${clienteNome}`);
                if (!navigator.onLine) {
                    alert("Sem internet: o checklist foi salvo no seu aparelho e será enviado automaticamente quando a conexão voltar. Pode fechar o app tranquilo.");
                    window.location.href = "relatorios.html";
                    return;
                }
                await gravacao;
                await enviarEmail(clienteNome, dados);
                alert("Checklist salvo com sucesso!");
                window.location.href = "relatorios.html";
            } catch (err) {
                alert("Erro ao salvar: " + err.message);
            } finally { btn.disabled = false; btn.innerText = "Salvar e gerar PDF"; }
        };
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col justify-between p-6 overflow-hidden">
        <div id="conteudo" class="hidden overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
                <a href="relatorios.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-base font-black text-blue-950">Checklist</h1>
                <div class="w-8"></div>
            </div>

            <label class="text-xs font-semibold text-slate-600">Cliente</label>
            <select id="cliente" class="w-full mt-1 mb-2 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Selecione o cliente</option>
            </select>

            <div class="bg-blue-950 text-white text-xs font-semibold rounded-xl px-3 py-2 mb-3 text-center" id="resumo">Conforme: 0 · Não conforme: 0 · N/A: 0</div>

            <div id="secoes"></div>

            <button type="button" id="btn-salvar" onclick="salvar()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-blue-700 transition">Salvar e gerar PDF</button>
            <p class="text-[11px] text-slate-400 mt-2 text-center mb-2">Fica salvo no histórico, gera PDF para WhatsApp e avisa o administrador por e-mail.</p>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="configuracoes.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></a>
            <a href="perfil.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
