<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - Entrada de Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50">

    <div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 flex flex-col items-center p-4 sm:p-6">
      
      <!-- Cabeçalho -->
      <div class="w-full max-w-md flex justify-between items-center mb-6">
        <div>
          <h1 class="text-xl font-bold text-blue-900">OliveWar</h1>
          <p class="text-xs text-gray-600">Preencha os detalhes para análise beta</p>
        </div>
        <button onclick="logout()" class="text-xs bg-white text-red-600 border border-red-200 px-3 py-1.5 rounded-lg shadow-sm hover:bg-red-50 cursor-pointer">
          Sair
        </button>
      </div>

      <!-- Formulário de Coleta de Dados (Estilo do Modelo) -->
      <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 sm:p-8 flex flex-col space-y-6">
        
        <form id="form-analise" onsubmit="salvarDados(event)" class="space-y-6">
          
          <!-- Seção 1: Identificação -->
          <div class="space-y-3">
            <h2 class="text-xs font-bold text-blue-800 uppercase tracking-wider border-b pb-1">1. Identificação da Empresa</h2>
            
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Nome da Empresa</label>
              <input type="text" id="empresa" placeholder="Ex: InovaTech" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">E-mail de Contato</label>
              <input type="email" id="email-contato" placeholder="seu@email.com" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Telefone</label>
              <input type="text" id="telefone" placeholder="(51) 99999-9999" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Cidade/UF</label>
              <input type="text" id="cidade" placeholder="Porto Alegre/RS" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
            </div>
          </div>

          <!-- Seção 2: Dados de Vendas / Projeto -->
          <div class="space-y-3">
            <h2 class="text-xs font-bold text-blue-800 uppercase tracking-wider border-b pb-1">2. Dados do Projeto</h2>
            
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Nome do Produto ou Serviço</label>
              <input type="text" id="produto" placeholder="Ex: Consultoria IA" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Preço de Venda (R$)</label>
                <input type="number" id="preco" placeholder="0,00" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Volume Mensal</label>
                <input type="number" id="volume" placeholder="Ex: 100" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
              </div>
            </div>
          </div>

          <!-- Botão de Ação -->
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer flex items-center justify-center space-x-2">
            <span>Enviar Dados para Análise</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
        </form>

      </div>
    </div>

    <!-- Script de Logout simples -->
    <script>
        function logout() {
            window.location.href = "index.html";
        }

        function salvarDados(event) {
            event.preventDefault();
            alert("Dados enviados com sucesso! Entraremos em contato em breve.");
            document.getElementById("form-analise").reset();
        }
    </script>
</body>
</html>
