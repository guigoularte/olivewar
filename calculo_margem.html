<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - Cálculo de Margem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioAtual = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            usuarioAtual = user;
            adicionarLinha();
            carregarSalvos();
        });

        const brl = (n) => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const num = (v) => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };

        // Adiciona uma nova linha de ingrediente
        window.adicionarLinha = (dados = {}) => {
            const container = document.getElementById('ingredientes');
            const div = document.createElement('div');
            div.className = "bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2 linha-ingrediente";
            div.innerHTML = `
                <div class="flex gap-2 items-center">
                    <input type="text" placeholder="Ingrediente (ex: Pão)" value="${dados.nome || ''}" class="in-nome flex-1 p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="button" onclick="this.closest('.linha-ingrediente').remove(); recalcular();" class="text-red-500 font-bold px-2 text-lg leading-none">&times;</button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="number" step="any" placeholder="Valor pago R$" value="${dados.valorPago ?? ''}" oninput="recalcular()" class="in-valor p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" step="any" placeholder="Peso comprado" value="${dados.pesoComprado ?? ''}" oninput="recalcular()" class="in-comprado p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" step="any" placeholder="Peso usado" value="${dados.pesoUsado ?? ''}" oninput="recalcular()" class="in-usado p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="text-right text-xs text-slate-500">Custo: <span class="custo-linha font-bold text-slate-700">R$ 0,00</span></div>
            `;
            container.appendChild(div);
            recalcular();
        };

        // Recalcula custos, lucro e margem
        window.recalcular = () => {
            let custoTotal = 0;
            document.querySelectorAll('.linha-ingrediente').forEach((linha) => {
                const valor = num(linha.querySelector('.in-valor').value);
                const comprado = num(linha.querySelector('.in-comprado').value);
                const usado = num(linha.querySelector('.in-usado').value);
                const custo = comprado > 0 ? (valor / comprado) * usado : 0;
                custoTotal += custo;
                linha.querySelector('.custo-linha').innerText = brl(custo);
            });

            const venda = num(document.getElementById('preco-venda').value);
            const lucro = venda - custoTotal;
            const margem = venda > 0 ? (lucro / venda) * 100 : 0;

            document.getElementById('res-custo').innerText = brl(custoTotal);
            document.getElementById('res-lucro').innerText = brl(lucro);
            document.getElementById('res-margem').innerText = margem.toFixed(1).replace(".", ",") + "%";

            const elLucro = document.getElementById('res-lucro');
            const elMargem = document.getElementById('res-margem');
            const cor = lucro >= 0 ? "text-green-600" : "text-red-600";
            elLucro.className = "font-black " + cor;
            elMargem.className = "font-black " + cor;
        };

        // Salva o produto no Firestore
        window.salvarProduto = async () => {
            const nomeProduto = document.getElementById('nome-produto').value.trim();
            if (!nomeProduto) { alert("Dê um nome ao produto (ex: Hambúrguer)."); return; }

            const ingredientes = [];
            document.querySelectorAll('.linha-ingrediente').forEach((linha) => {
                const nome = linha.querySelector('.in-nome').value.trim();
                if (!nome) return;
                ingredientes.push({
                    nome,
                    valorPago: num(linha.querySelector('.in-valor').value),
                    pesoComprado: num(linha.querySelector('.in-comprado').value),
                    pesoUsado: num(linha.querySelector('.in-usado').value)
                });
            });
            if (ingredientes.length === 0) { alert("Adicione pelo menos um ingrediente."); return; }

            try {
                await addDoc(collection(db, "usuarios", usuarioAtual.uid, "margens"), {
                    nomeProduto,
                    ingredientes,
                    precoVenda: num(document.getElementById('preco-venda').value),
                    data: new Date().toISOString()
                });
                alert("Produto salvo com sucesso!");
                carregarSalvos();
            } catch (err) {
                alert("Erro ao salvar: " + err.message);
            }
        };

        async function carregarSalvos() {
            const snap = await getDocs(collection(db, "usuarios", usuarioAtual.uid, "margens"));
            const lista = document.getElementById('lista-salvos');
            lista.innerHTML = '';
            if (snap.empty) { lista.innerHTML = '<p class="text-xs text-slate-400 text-center">Nenhum produto salvo ainda.</p>'; return; }
            snap.forEach((d) => {
                const p = d.data();
                const custo = (p.ingredientes || []).reduce((s, i) => s + (i.pesoComprado > 0 ? (i.valorPago / i.pesoComprado) * i.pesoUsado : 0), 0);
                const margem = p.precoVenda > 0 ? ((p.precoVenda - custo) / p.precoVenda) * 100 : 0;
                lista.innerHTML += `<div class="p-3 bg-white rounded-xl shadow-sm border border-slate-200 flex justify-between items-center text-sm">
                    <div>
                        <span class="font-bold text-slate-800">${p.nomeProduto}</span>
                        <div class="text-xs text-slate-500">Custo ${brl(custo)} · Margem ${margem.toFixed(1).replace(".", ",")}%</div>
                    </div>
                    <button onclick="excluirSalvo('${d.id}')" class="text-red-500 text-xs font-semibold">Excluir</button>
                </div>`;
            });
        }

        window.excluirSalvo = async (id) => {
            if (!confirm("Excluir este produto?")) return;
            await deleteDoc(doc(db, "usuarios", usuarioAtual.uid, "margens", id));
            carregarSalvos();
        };
    </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#f4f7fb] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-slate-300 flex flex-col justify-between p-6 overflow-hidden">
        <div class="overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <a href="app.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-lg font-black text-blue-950">Cálculo de Margem</h1>
                <div class="w-8"></div>
            </div>

            <input type="text" id="nome-produto" placeholder="Nome do produto (ex: Hambúrguer)" class="w-full p-2.5 border rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-blue-500 font-semibold">

            <p class="text-[11px] text-slate-500 mb-2 leading-snug">Informe o <b>valor pago</b> e o <b>peso comprado</b> da embalagem, e o <b>peso usado</b> por unidade. Use a mesma unidade (g, kg, ml...) nos dois pesos.</p>

            <div id="ingredientes" class="space-y-2 mb-3"></div>

            <button type="button" onclick="adicionarLinha()" class="w-full border-2 border-dashed border-blue-300 text-blue-600 font-bold py-2 rounded-xl text-sm hover:bg-blue-50 transition mb-4">+ Adicionar ingrediente</button>

            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 mb-4">
                <label class="text-xs font-semibold text-slate-600">Preço de venda (R$)</label>
                <input type="number" step="any" id="preco-venda" placeholder="0,00" oninput="recalcular()" class="w-full p-2 border rounded-lg text-sm mt-1 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="bg-blue-950 text-white p-4 rounded-2xl grid grid-cols-3 gap-2 text-center mb-4">
                <div>
                    <div class="text-[10px] uppercase tracking-wide text-blue-200">Custo</div>
                    <div id="res-custo" class="font-black">R$ 0,00</div>
                </div>
                <div>
                    <div class="text-[10px] uppercase tracking-wide text-blue-200">Lucro</div>
                    <div id="res-lucro" class="font-black">R$ 0,00</div>
                </div>
                <div>
                    <div class="text-[10px] uppercase tracking-wide text-blue-200">Margem</div>
                    <div id="res-margem" class="font-black">0%</div>
                </div>
            </div>

            <button type="button" onclick="salvarProduto()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition mb-5">Salvar produto</button>

            <h2 class="text-sm font-bold text-slate-700 mb-2">Produtos salvos</h2>
            <div id="lista-salvos" class="space-y-2 mb-2"></div>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="configuracoes.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></a>
            <a href="perfil.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
