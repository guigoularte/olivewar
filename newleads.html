<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - NewLeads</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY",
            authDomain: "olivewar-1e5e2.firebaseapp.com",
            projectId: "olivewar-1e5e2",
            storageBucket: "olivewar-1e5e2.firebasestorage.app",
            messagingSenderId: "437889793363",
            appId: "1:437889793363:web:508e445177eb06f6e435a6",
            measurementId: "G-GGB4C2X6TL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioAtual = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioAtual = user;
            } else {
                window.location.href = "login.html";
            }
        });

        window.logout = async () => {
            await signOut(auth);
            window.location.href = "index.html";
        };

        window.salvarDados = async (event) => {
            event.preventDefault();
            if (!usuarioAtual) return;

            const btn = event.target.querySelector('button');
            btn.innerText = "Enviando...";

            const dados = {
                email: usuarioAtual.email,
                empresa: document.getElementById('empresa').value,
                emailContato: document.getElementById('email-contato').value,
                telefone: document.getElementById('telefone').value,
                cidade: document.getElementById('cidade').value,
                produto: document.getElementById('produto').value,
                preco: document.getElementById('preco').value,
                volume: document.getElementById('volume').value,
                dataEnvio: new Date().toISOString()
            };

            try {
                const leadId = "lead_" + Date.now();
                await setDoc(doc(db, "usuarios", usuarioAtual.uid, "leads", leadId), dados);
                
                alert("Lead cadastrado com sucesso!");
                // A linha abaixo fará o redirecionamento para a tela inicial
                window.location.href = "index.html"; 
            } catch (error) {
                alert("Erro ao salvar: " + error.message);
                btn.innerText = "Enviar Dados para Análise";
            }
        };
    </script>
</head>
<body class="bg-blue-50">

   <div class="min-h-screen flex flex-col items-center p-4">
      <!-- Cabeçalho com botão de Voltar -->
      <div class="w-full max-w-md flex justify-between items-center mb-6">
        <a href="index.html" class="flex items-center text-sm font-semibold text-blue-900 hover:text-blue-700 transition">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
            Voltar
        </a>
        <h1 class="text-xl font-bold text-blue-900">NewLeads</h1>
        <!-- Botão Sair removido ou movido para rodapé -->
        <div class="w-16"></div> <!-- Espaçador para centralizar o título -->
      </div>

      <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">
        <form id="form-analise" onsubmit="salvarDados(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-700">Nome da Empresa</label>
              <input type="text" id="empresa" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" required>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700">E-mail de Contato</label>
              <input type="email" id="email-contato" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" required>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700">Telefone</label>
              <input type="text" id="telefone" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" required>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700">Cidade/UF</label>
              <input type="text" id="cidade" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" required>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700">Nome do Produto</label>
              <input type="text" id="produto" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" required>
            </div>
            <div class="flex gap-2">
                <input type="number" id="preco" placeholder="Preço" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" required>
                <input type="number" id="volume" placeholder="Vol." class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" required>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl mt-4">Enviar Dados para Análise</button>
        </form>
      </div>
    </div>
</body>
</html>
