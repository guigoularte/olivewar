<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OliveWar - NewLeads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const leadId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            if (leadId) {
                const docSnap = await getDoc(doc(db, "usuarios", user.uid, "leads", leadId));
                if (docSnap.exists()) {
                    const d = docSnap.data();
                    document.getElementById('nome-usuario').value = d.nomeUsuario || '';
                    document.getElementById('empresa').value = d.empresa;
                    document.getElementById('email-contato').value = d.emailContato;
                    // ... preencha os outros IDs ...
                }
            }
        });

        window.salvarDados = async (event) => {
            event.preventDefault();
            const uid = auth.currentUser.uid;
            const id = leadId || "lead_" + Date.now();
            await setDoc(doc(db, "usuarios", uid, "leads", id), {
                nomeUsuario: document.getElementById('nome-usuario').value,
                empresa: document.getElementById('empresa').value,
                emailContato: document.getElementById('email-contato').value,
                produto: document.getElementById('produto').value,
                dataEnvio: new Date().toISOString()
            }, { merge: true });
            alert("Salvo com sucesso!");
            window.location.href = "index.html";
        };
    </script>
</head>
<body class="bg-blue-50 p-6">
    <div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl">
        <a href="index.html" class="text-blue-900 font-bold mb-4 block">← Voltar</a>
        <form onsubmit="salvarDados(event)" class="space-y-4">
            <div><label class="text-xs font-bold">Seu Nome</label><input type="text" id="nome-usuario" class="w-full border p-2 rounded-lg" required></div>
            <div><label class="text-xs font-bold">Empresa</label><input type="text" id="empresa" class="w-full border p-2 rounded-lg" required></div>
            <div><label class="text-xs font-bold">Produto</label><input type="text" id="produto" class="w-full border p-2 rounded-lg" required></div>
            <button class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Salvar Dados</button>
        </form>
    </div>
</body>
</html>
