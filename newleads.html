<form onsubmit="salvarLead(event)" class="max-w-xs mx-auto space-y-4">
    <h2 class="font-bold">Formulário de Contato</h2>
    <input type="text" id="empresa" placeholder="Empresa" class="w-full border p-2 rounded-lg" required>
    <input type="email" id="email-contato" placeholder="E-mail" class="w-full border p-2 rounded-lg" required>
    <button class="w-full bg-blue-600 text-white py-2 rounded-lg">Enviar Lead</button>
</form>
<script type="module">
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    window.salvarLead = async (e) => {
        e.preventDefault();
        const db = getFirestore();
        await addDoc(collection(db, "leads_comerciais"), {
            empresa: document.getElementById('empresa').value,
            email: document.getElementById('email-contato').value
        });
        alert("Enviado com sucesso!");
        window.location.href = "index.html";
    };
</script>
