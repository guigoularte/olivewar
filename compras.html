<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioAtual = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            usuarioAtual = user;
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const dd = snap.exists() ? snap.data() : {}; const fx = dd.funcionalidades || {};
            const ok = dd.role === "master" || (('compras' in fx) ? fx.compras : true);
            if (!ok) { alert("Esta funcionalidade não está disponível no seu plano."); window.location.href = "app.html"; return; }
            carregarProdutos();
        });

        window.salvarProduto = async (e) => {
            e.preventDefault();
            const nomeProd = document.getElementById('nome-produto').value;
            const precoProd = document.getElementById('preco-produto').value;

            try {
                await addDoc(collection(db, "usuarios", usuarioAtual.uid, "produtos"), {
                    nome: nomeProd,
                    preco: precoProd,
                    data: new Date().toISOString()
                });
                document.getElementById('form-produto').reset();
                carregarProdutos();
                alert("Produto cadastrado com sucesso!");
            } catch (err) {
                alert("Erro ao salvar: " + err.message);
            }
        };

        async function carregarProdutos() {
            const querySnapshot = await getDocs(collection(db, "usuarios", usuarioAtual.uid, "produtos"));
            const lista = document.getElementById('lista-produtos');
            lista.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const p = doc.data();
                lista.innerHTML += `<div class="p-3 bg-white rounded-xl shadow-sm border border-slate-200 flex justify-between items-center text-sm">
                    <span class="font-bold text-slate-800">${p.nome}</span>
                    <span class="text-blue-600 font-semibold">R$ ${p.preco}</span>
                </div>`;
            });
        }
    </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#f4f7fb] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-slate-300 flex flex-col justify-between p-6 overflow-hidden">
        <div>
            <div class="flex items-center justify-between mb-6">
                <a href="app.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-lg font-black text-blue-950">Produtos / Serviços</h1>
                <div class="w-8"></div>
            </div>

            <form id="form-produto" onsubmit="salvarProduto(event)" class="space-y-3 mb-6 bg-white p-4 rounded-2xl shadow-sm">
                <input type="text" id="nome-produto" placeholder="Nome do Produto" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
                <input type="number" id="preco-produto" placeholder="Preço (R$)" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition">Adicionar Produto</button>
            </form>

            <div id="lista-produtos" class="space-y-2 max-h-[320px] overflow-y-auto"></div>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="configuracoes.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></a>
            <a href="perfil.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
