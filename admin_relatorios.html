<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Todos os Relatórios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="oliver_pdf.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let todos = []; // todos os relatórios agregados

        const TIPO = { vistoria: "Vistoria", primeira_visita: "1ª Visita", checklist: "Checklist" };

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            const meu = await getDoc(doc(db, "usuarios", user.uid));
            if (!meu.exists() || meu.data().role !== "master") {
                alert("Acesso restrito ao administrador.");
                window.location.href = "app.html";
                return;
            }
            document.getElementById('conteudo').classList.remove('hidden');
            carregarTudo();
        });

        async function carregarTudo() {
            todos = [];
            const usuarios = await getDocs(collection(db, "usuarios"));
            for (const u of usuarios.docs) {
                const nomeFunc = u.data().nome || u.data().email || "funcionário";
                const rel = await getDocs(collection(db, "usuarios", u.id, "relatorios_enviados"));
                rel.forEach((r) => todos.push({ id: r.id, funcUid: u.id, funcNome: nomeFunc, ...r.data() }));
            }
            todos.sort((a, b) => (b.data || "").localeCompare(a.data || ""));

            // preenche filtro de funcionários
            const funcs = [...new Set(todos.map(t => t.funcionario || t.funcNome))].sort();
            const sel = document.getElementById('filtro-func');
            funcs.forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f; sel.appendChild(o); });

            render();
        }

        window.render = () => {
            const fFunc = document.getElementById('filtro-func').value;
            const fTipo = document.getElementById('filtro-tipo').value;
            const lista = todos
                .filter(t => !fFunc || (t.funcionario || t.funcNome) === fFunc)
                .filter(t => !fTipo || t.tipo === fTipo);

            document.getElementById('contador').innerText = lista.length + " relatório(s)";
            const cont = document.getElementById('lista');
            cont.innerHTML = '';
            if (lista.length === 0) { cont.innerHTML = '<p class="text-sm text-slate-400 text-center mt-8">Nenhum relatório encontrado.</p>'; return; }

            lista.forEach((r, i) => {
                const dataFmt = r.data ? new Date(r.data).toLocaleString("pt-BR") : "";
                let resumo = "";
                if (r.tipo === "checklist" && r.resumo) resumo = `Conforme ${r.resumo.sim} · Não conforme ${r.resumo.nao} · N/A ${r.resumo.na}`;
                else resumo = `${(r.itens || []).length} item(ns)`;
                cont.innerHTML += `<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-3">
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <span class="text-[10px] font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded">${TIPO[r.tipo] || r.tipo || "Relatório"}</span>
                            <div class="font-bold text-slate-800 text-sm mt-1">${r.funcionario || r.funcNome}</div>
                            <div class="text-[11px] text-slate-500">Cliente: ${r.clienteNome || "—"}</div>
                            <div class="text-[10px] text-slate-400">${dataFmt} · ${resumo}</div>
                        </div>
                        <button onclick="pdf(${i})" class="bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-blue-100 whitespace-nowrap">📄 PDF</button>
                    </div>
                </div>`;
            });
            window._listaAtual = lista;
        };

        window.pdf = (i) => {
            const r = window._listaAtual[i];
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            let y = oliverPdfHeader(pdf, TIPO[r.tipo] || "Relatório", r.clienteNome || "");
            pdf.setFontSize(10); pdf.setTextColor(0, 0, 0);
            pdf.text(`Funcionário: ${r.funcionario || r.funcNome}`, 14, y); y += 6;
            pdf.text(`Cliente: ${r.clienteNome || "—"}`, 14, y); y += 6;
            pdf.text(`Data: ${r.data ? new Date(r.data).toLocaleString("pt-BR") : ""}`, 14, y); y += 8;

            if (r.tipo === "checklist" && r.resumo) {
                pdf.text(`Conforme: ${r.resumo.sim}  |  Não conforme: ${r.resumo.nao}  |  N/A: ${r.resumo.na}`, 14, y); y += 8;
            } else {
                if (r.responsavel) { pdf.text(`Responsável: ${r.responsavel}`, 14, y); y += 6; }
                if (r.objetivo) { const l = pdf.splitTextToSize(`Objetivo: ${r.objetivo}`, 180); pdf.text(l, 14, y); y += l.length * 6; }
                if (r.observacoes) { const l = pdf.splitTextToSize(`Observações: ${r.observacoes}`, 180); pdf.text(l, 14, y); y += l.length * 6; }
                y += 2;
                (r.itens || []).forEach((it, idx) => {
                    if (y > 250) { pdf.addPage(); y = 20; }
                    const l = pdf.splitTextToSize(`${idx + 1}. ${it.descricao || ""}`, 180);
                    pdf.text(l, 14, y); y += l.length * 6;
                    if (it.fotoAntes) { if (y > 210) { pdf.addPage(); y = 20; } try { pdf.addImage(it.fotoAntes, "JPEG", 14, y, 55, 41); y += 46; } catch (e) { y += 2; } }
                    y += 2;
                });
            }
            oliverPdfFooter(pdf);
            pdf.save("relatorio.pdf");
        };
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col justify-between p-6 overflow-hidden">
        <div id="conteudo" class="hidden overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
                <a href="admin.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-base font-black text-blue-950">Todos os Relatórios</h1>
                <div class="w-8"></div>
            </div>

            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 mb-3 grid grid-cols-2 gap-2">
                <select id="filtro-func" onchange="render()" class="p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-orange-400">
                    <option value="">Todos os funcionários</option>
                </select>
                <select id="filtro-tipo" onchange="render()" class="p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-orange-400">
                    <option value="">Todos os tipos</option>
                    <option value="vistoria">Vistoria</option>
                    <option value="primeira_visita">1ª Visita</option>
                    <option value="checklist">Checklist</option>
                </select>
            </div>
            <p id="contador" class="text-[11px] text-slate-500 mb-2">Carregando...</p>

            <div id="lista"></div>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="admin.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg></a>
            <a href="perfil.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
