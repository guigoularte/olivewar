<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Relatório de 1ª Visita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>emailjs.init({ publicKey: "Jwl7iLqUNND6syxRU" });</script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const EMAIL_SERVICE = "service_yuf3qik";
        const EMAIL_TEMPLATE = "template_r7hf9fm";

        let usuarioAtual = null, nomeFuncionario = "", itens = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            usuarioAtual = user;
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const dados = snap.exists() ? snap.data() : {};
            const permitido = dados.role === "master" || (dados.funcionalidades && dados.funcionalidades.relatorios);
            if (!permitido) { alert("Esta funcionalidade não está disponível no seu plano."); window.location.href = "app.html"; return; }
            nomeFuncionario = dados.nome || user.email;
            document.getElementById('conteudo').classList.remove('hidden');
            carregarClientes();
        });

        async function carregarClientes() {
            const select = document.getElementById('cliente');
            try {
                const snap = await getDocs(collection(db, "usuarios"));
                let qtd = 0;
                snap.forEach((d) => {
                    if (d.id === usuarioAtual.uid) return;
                    const u = d.data();
                    if (u.role === "master") return;
                    const opt = document.createElement('option');
                    opt.value = d.id; opt.textContent = `${u.nome || "(sem nome)"} — ${u.email || ""}`;
                    select.appendChild(opt); qtd++;
                });
                if (qtd === 0) document.getElementById('aviso-clientes').innerText = "Nenhum cliente cadastrado ainda.";
            } catch (err) {
                document.getElementById('aviso-clientes').innerText = "Erro ao carregar clientes: " + err.message;
            }
        }

        function comprimirImagem(file, maxLado = 900, qualidade = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > height && width > maxLado) { height = height * maxLado / width; width = maxLado; }
                        else if (height > maxLado) { width = width * maxLado / height; height = maxLado; }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', qualidade));
                    };
                    img.onerror = reject; img.src = e.target.result;
                };
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

        window.adicionarItem = async () => {
            const descricao = document.getElementById('descricao').value.trim();
            const arquivo = document.getElementById('foto').files[0];
            if (!descricao) { alert("Escreva a anotação do item."); return; }
            let foto = "";
            if (arquivo) {
                document.getElementById('btn-add').innerText = "Processando foto...";
                try { foto = await comprimirImagem(arquivo); } catch (e) { alert("Não foi possível processar a foto."); }
                document.getElementById('btn-add').innerText = "+ Adicionar item";
            }
            itens.push({ descricao, foto });
            document.getElementById('descricao').value = ""; document.getElementById('foto').value = "";
            renderItens();
        };

        window.removerItem = (i) => { itens.splice(i, 1); renderItens(); };

        function renderItens() {
            const lista = document.getElementById('lista-itens');
            lista.innerHTML = '';
            itens.forEach((it, i) => {
                lista.innerHTML += `<div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-sm">
                    <div class="flex justify-between items-start gap-2">
                        <p class="text-slate-700 flex-1">${it.descricao}</p>
                        <button onclick="removerItem(${i})" class="text-red-500 font-bold">&times;</button>
                    </div>
                    ${it.foto ? `<img src="${it.foto}" class="mt-2 rounded-lg w-full max-h-40 object-cover">` : ''}
                </div>`;
            });
            document.getElementById('contador').innerText = itens.length;
        }

        function coletarCampos() {
            return {
                responsavel: document.getElementById('responsavel').value.trim(),
                objetivo: document.getElementById('objetivo').value.trim(),
                observacoes: document.getElementById('observacoes').value.trim()
            };
        }

        function gerarPDF(clienteNome, campos, listaItens) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            let y = 20;
            pdf.setFontSize(18); pdf.setTextColor(23, 37, 84);
            pdf.text("Oliver - Relatório de 1ª Visita", 14, y); y += 10;
            pdf.setFontSize(11); pdf.setTextColor(0, 0, 0);
            pdf.text(`Cliente: ${clienteNome}`, 14, y); y += 6;
            pdf.text(`Funcionário: ${nomeFuncionario}`, 14, y); y += 6;
            if (campos.responsavel) { pdf.text(`Responsável atendente: ${campos.responsavel}`, 14, y); y += 6; }
            pdf.setFontSize(9); pdf.setTextColor(120, 120, 120);
            pdf.text(`Gerado em ${new Date().toLocaleString("pt-BR")}`, 14, y); y += 10;
            pdf.setFontSize(11); pdf.setTextColor(0, 0, 0);
            if (campos.objetivo) { pdf.text("Objetivo da visita:", 14, y); y += 6; const l = pdf.splitTextToSize(campos.objetivo, 180); pdf.text(l, 14, y); y += l.length * 6 + 2; }
            if (campos.observacoes) { pdf.text("Observações gerais:", 14, y); y += 6; const l = pdf.splitTextToSize(campos.observacoes, 180); pdf.text(l, 14, y); y += l.length * 6 + 2; }
            if (listaItens.length) { y += 2; pdf.text("Itens observados:", 14, y); y += 8; }
            listaItens.forEach((it, idx) => {
                if (y > 250) { pdf.addPage(); y = 20; }
                const linhas = pdf.splitTextToSize(`${idx + 1}. ${it.descricao || ""}`, 180);
                pdf.text(linhas, 14, y); y += linhas.length * 6;
                if (it.foto) { if (y > 210) { pdf.addPage(); y = 20; } try { pdf.addImage(it.foto, "JPEG", 14, y, 60, 45); y += 50; } catch (e) { y += 2; } }
                y += 4;
            });
            return pdf;
        }

        async function compartilharPDF(pdf, nomeArq, texto) {
            try {
                const blob = pdf.output("blob");
                const file = new File([blob], nomeArq, { type: "application/pdf" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: "Relatório de 1ª Visita", text: texto });
                    return;
                }
            } catch (e) { console.log(e); }
            pdf.save(nomeArq);
        }

        async function enviarEmailAdmin(clienteNome, campos, listaItens) {
            const conteudo = [
                campos.responsavel ? `Responsável: ${campos.responsavel}` : "",
                campos.objetivo ? `Objetivo: ${campos.objetivo}` : "",
                campos.observacoes ? `Observações: ${campos.observacoes}` : "",
                "", "Itens:",
                ...listaItens.map((it, i) => `${i + 1}. ${it.descricao}`)
            ].filter(Boolean).join("\n");
            try {
                await emailjs.send(EMAIL_SERVICE, EMAIL_TEMPLATE, {
                    tipo_relatorio: "Relatório de 1ª Visita",
                    funcionario: nomeFuncionario, cliente: clienteNome,
                    conteudo, data: new Date().toLocaleString("pt-BR")
                });
            } catch (e) { console.error("Falha ao enviar e-mail ao admin:", e); }
        }

        window.salvar = async () => {
            const select = document.getElementById('cliente');
            const clienteId = select.value;
            const clienteNome = clienteId ? select.options[select.selectedIndex].text : "(sem cliente)";
            const campos = coletarCampos();
            if (!campos.responsavel) { alert("Informe o responsável atendente."); return; }
            if (itens.length === 0 && !campos.observacoes) { alert("Adicione observações ou pelo menos um item."); return; }

            const btn = document.getElementById('btn-salvar');
            btn.disabled = true; btn.innerText = "Salvando...";
            try {
                const relatorio = {
                    tipo: "primeira_visita", funcionario: nomeFuncionario,
                    clienteId: clienteId || "", clienteNome,
                    responsavel: campos.responsavel, objetivo: campos.objetivo, observacoes: campos.observacoes,
                    itens: itens.map(it => ({ descricao: it.descricao, fotoAntes: it.foto || "" })),
                    data: new Date().toISOString()
                };
                await addDoc(collection(db, "usuarios", usuarioAtual.uid, "relatorios_enviados"), relatorio);

                await enviarEmailAdmin(clienteNome, campos, itens);
                const pdf = gerarPDF(clienteNome, campos, itens);
                await compartilharPDF(pdf, "relatorio-primeira-visita.pdf", `Relatório de 1ª visita - ${clienteNome}`);

                alert("Relatório salvo com sucesso!");
                window.location.href = "relatorios.html";
            } catch (err) {
                alert("Erro ao salvar: " + err.message);
            } finally { btn.disabled = false; btn.innerText = "Salvar e gerar PDF"; }
        };
    </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#f4f7fb] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-slate-300 flex flex-col justify-between p-6 overflow-hidden">
        <div id="conteudo" class="hidden overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <a href="relatorios.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-lg font-black text-blue-950">1ª Visita</h1>
                <div class="w-8"></div>
            </div>

            <label class="text-xs font-semibold text-slate-600">Cliente</label>
            <select id="cliente" class="w-full mt-1 mb-1 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Selecione o cliente</option>
            </select>
            <p id="aviso-clientes" class="text-[11px] text-slate-400 mb-3"></p>

            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 space-y-3 mb-4">
                <div>
                    <label class="text-xs font-semibold text-slate-600">Responsável atendente</label>
                    <input type="text" id="responsavel" placeholder="Quem te recebeu na visita" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">Objetivo da visita</label>
                    <textarea id="objetivo" rows="2" placeholder="Objetivo / motivo da visita" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">Observações gerais</label>
                    <textarea id="observacoes" rows="3" placeholder="Impressões gerais da 1ª visita" class="w-full mt-1 p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>

            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 space-y-2 mb-3">
                <label class="text-xs font-semibold text-slate-600">Item observado (opcional)</label>
                <textarea id="descricao" rows="2" placeholder="Anotação do item" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <input type="file" id="foto" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 file:font-semibold">
                <button type="button" id="btn-add" onclick="adicionarItem()" class="w-full bg-slate-100 text-slate-700 font-bold py-2 rounded-lg text-sm hover:bg-slate-200 transition">+ Adicionar item</button>
            </div>

            <h2 class="text-sm font-bold text-slate-700 mb-2">Itens (<span id="contador">0</span>)</h2>
            <div id="lista-itens" class="space-y-2 mb-4"></div>

            <button type="button" id="btn-salvar" onclick="salvar()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-blue-700 transition">Salvar e gerar PDF</button>
            <p class="text-[11px] text-slate-400 mt-2 text-center">Fica salvo no histórico, gera PDF para WhatsApp e avisa o administrador por e-mail.</p>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="configuracoes.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></a>
            <a href="perfil.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
