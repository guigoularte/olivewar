<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EmailJS: SDK para enviar e-mail direto do navegador -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        // ⚠️ SUBSTITUA pela sua Public Key do EmailJS (Account > General)
        emailjs.init({ publicKey: "Jwl7iLqUNND6syxRU" });
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let ehCadastro = false;

        window.alternarModo = () => {
            ehCadastro = !ehCadastro;
            const titulo = document.getElementById('titulo-topo');
            
            document.getElementById('grupo-nome').style.display = ehCadastro ? 'block' : 'none';
            document.getElementById('nome').required = ehCadastro;
            
            titulo.innerText = ehCadastro ? "Criar Conta" : "Login";
            document.getElementById('btn-submit').innerText = ehCadastro ? "Cadastrar" : "Entrar";
            document.getElementById('texto-alternativa').innerHTML = ehCadastro 
                ? 'Já tem uma conta? <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold underline">Entrar</button>'
                : 'Não tem uma conta? <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold underline">Criar conta</button>';
        };

       window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (ehCadastro) {
                    const nome = document.getElementById('nome').value;
                    console.log("Tentando criar usuário no Auth...");
                    const cred = await createUserWithEmailAndPassword(auth, email, password);

                    console.log("Tentando salvar nome no Firestore...");
                    // Todo novo cadastro entra como "cliente" por padrão
                    await setDoc(doc(db, "usuarios", cred.user.uid), { nome: nome, email: email, role: "cliente" });

                    // Avisa o administrador por e-mail sobre o novo cadastro
                    try {
                        await emailjs.send("service_yuf3qik", "template_ljx1rge", {
                            nome_usuario: nome,
                            email_usuario: email,
                            data_cadastro: new Date().toLocaleString("pt-BR")
                        });
                    } catch (mailErr) {
                        console.error("Falha ao enviar e-mail de aviso:", mailErr);
                    }

                    alert("Conta criada com sucesso!");
                } else {
                    console.log("Tentando fazer login...");
                    await signInWithEmailAndPassword(auth, email, password);
                }
                window.location.href = "app.html";
            } catch (err) {
                console.error("Erro detalhado:", err);
                alert("Erro: " + err.message);
            }
        };
    </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-none sm:max-w-sm bg-white p-8 min-h-[100dvh] sm:min-h-0 flex flex-col justify-center sm:block sm:rounded-[40px] shadow-2xl sm:border-4 border-slate-300">
        <h2 id="titulo-topo" class="text-2xl font-black text-center mb-6 text-blue-950">Login</h2>
        
        <form onsubmit="handleAuth(event)" class="space-y-4">
            <div id="grupo-nome" style="display: none;">
                <input type="text" id="nome" placeholder="Seu Nome" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <div>
                <input type="email" id="email" placeholder="E-mail" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
            </div>

            <div>
                <input type="password" id="password" placeholder="Senha" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl transition cursor-pointer shadow-lg">
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            <span id="texto-alternativa">
                Não tem uma conta? <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold underline cursor-pointer">Criar conta</button>
            </span>
        </div>
    </div>

</body>
</html>
