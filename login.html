<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- BLOCO DE SCRIPT CORRETAMENTE ENCAPSULADO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY",
            authDomain: "olivewar-1e5e2.firebaseapp.com",
            projectId: "olivewar-1e5e2",
            storageBucket: "olivewar-1e5e2.firebasestorage.app",
            messagingSenderId: "437889793363",
            appId: "1:437889793363:web:508e445177eb06f6e435a6",
            measurementId: "G-GGB4C2X6TL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let ehModoCadastro = false;

        window.alternarModo = function() {
            ehModoCadastro = !ehModoCadastro;
            const subtitulo = document.getElementById('subtitulo-pagina');
            const botao = document.getElementById('botao-acao');
            const opcoesLogin = document.getElementById('opcoes-login');
            const textoAlternativa = document.getElementById('texto-alternativa');

            if (ehModoCadastro) {
                subtitulo.innerText = "Crie sua nova conta para o ambiente beta.";
                botao.innerText = "Cadastrar usuário";
                opcoesLogin.style.display = "none";
                textoAlternativa.innerHTML = 'Já tem uma conta? <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold hover:underline ml-1 cursor-pointer">Entrar</button>';
            } else {
                subtitulo.innerText = "Insira suas credenciais para acessar o ambiente beta.";
                botao.innerText = "Entrar";
                opcoesLogin.style.display = "flex";
                textoAlternativa.innerHTML = 'Ainda não tem uma conta? <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold hover:underline ml-1 cursor-pointer">Criar conta</button>';
            }
        };

        window.handleAuth = async (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (ehModoCadastro) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    await setDoc(doc(db, "usuarios", user.uid), {
                        email: email,
                        dadosPreenchidos: false
                    });

                    alert("Usuário cadastrado com sucesso!");
                    window.location.href = "dashboard.html"; 
                } else {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    const docRef = doc(db, "usuarios", user.uid);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists() && docSnap.data().dadosPreenchidos === true) {
                        alert("Login realizado com sucesso!");
                        window.location.href = "index.html"; 
                    } else {
                        alert("Login realizado. Por favor, preencha seus dados.");
                        window.location.href = "dashboard.html"; 
                    }
                }
            } catch (error) {
                alert("Erro na autenticação: " + error.message);
            }
        };
    </script>
</head>
<body class="bg-blue-50">

    <div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 flex flex-col items-center justify-between p-6">
      
      <!-- Cabeçalho -->
      <div class="flex flex-col items-center mt-8">
        <div class="bg-white p-3 rounded-full shadow-md mb-4">
          <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.115 6.448l-.054.09A13.916 13.916 0 0112 21c-1.292 0-2.536-.172-3.71-.492"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-blue-900 tracking-wide">OliveWar</h1>
        <p id="subtitulo-pagina" class="text-gray-600 text-center text-xs mt-1">Insira suas credenciais para acessar o ambiente beta.</p>
      </div>

      <!-- Formulário -->
      <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 flex flex-col my-auto">
        
        <form class="space-y-4" onsubmit="handleAuth(event)">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">E-mail</label>
            <input type="email" id="email" placeholder="seu.email@colega.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Senha</label>
            <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
          </div>

          <div id="opcoes-login" class="flex items-center justify-between text-xs text-gray-600">
            <label class="flex items-center">
              <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 mr-2"> Lembre-me
            </label>
            <a href="#" class="text-blue-600 hover:underline font-medium">Esqueceu a senha?</a>
          </div>

          <button type="submit" id="botao-acao" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 text-sm mt-2 cursor-pointer">
            Entrar
          </button>
        </form>

        <div class="mt-6 text-center border-t border-gray-100 pt-4">
          <p id="texto-alternativa" class="text-xs text-gray-600">
            Ainda não tem uma conta? 
            <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold hover:underline ml-1 cursor-pointer">Criar conta</button>
          </p>
        </div>

        <div class="mt-4 text-center">
          <a href="index.html" class="text-xs text-gray-400 hover:text-blue-600 transition">← Voltar para a página inicial</a>
        </div>
      </div>

      <!-- Rodapé -->
      <div class="text-center text-xs text-gray-400 mt-4">
        OliveWar Beta v1.0
      </div>

    </div>

</body>
</html>
