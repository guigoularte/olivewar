<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <!-- EmailJS: SDK para enviar e-mail direto do navegador -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        // ⚠️ SUBSTITUA pela sua Public Key do EmailJS (Account > General)
        emailjs.init({ publicKey: "Jwl7iLqUNND6syxRU" });
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, sendEmailVerification, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let ehCadastro = false;

        // Código de acesso pessoal (6 caracteres, sem 0/O/1/I). O cliente informa à empresa para ser vinculado.
        function gerarCodigoAcesso() {
            const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let s = "";
            for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
            return s;
        }

        window.alternarModo = () => {
            ehCadastro = !ehCadastro;
            const titulo = document.getElementById('titulo-topo');
            
            document.getElementById('grupo-cadastro').style.display = ehCadastro ? 'block' : 'none';
            document.getElementById('nome').required = ehCadastro;
            document.getElementById('telefone').required = ehCadastro;
            document.getElementById('segmento').required = ehCadastro;
            document.getElementById('faturamento').required = ehCadastro;
            document.getElementById('cep').required = ehCadastro;
            document.getElementById('cidade').required = ehCadastro;
            document.getElementById('estado').required = ehCadastro;
            
            titulo.innerText = ehCadastro ? "Criar Conta" : "Login";
            document.getElementById('btn-submit').innerText = ehCadastro ? "Cadastrar" : "Entrar";
            document.getElementById('texto-alternativa').innerHTML = ehCadastro 
                ? 'Já tem uma conta? <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold underline">Entrar</button>'
                : 'Não tem uma conta? <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold underline">Criar conta</button>';
        };

       window.recuperarSenha = async () => {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert("Digite seu e-mail no campo acima e clique novamente em \"Esqueci minha senha\".");
                document.getElementById('email').focus();
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Enviamos um link de recuperação para " + email + ". Verifique sua caixa de entrada e o spam.");
            } catch (err) {
                console.error("Erro ao recuperar senha:", err);
                if (err.code === "auth/invalid-email") alert("E-mail inválido. Confira e tente de novo.");
                else if (err.code === "auth/user-not-found") alert("Não encontramos uma conta com esse e-mail.");
                else alert("Não foi possível enviar o e-mail: " + err.message);
            }
        };

       window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (ehCadastro) {
                    const nome = document.getElementById('nome').value;
                    const telefone = document.getElementById('telefone').value;
                    const segmento = document.getElementById('segmento').value;
                    const faturamento = document.getElementById('faturamento').value;
                    const cep = document.getElementById('cep').value;
                    const cidade = document.getElementById('cidade').value;
                    const estado = document.getElementById('estado').value;
                    const codigoEmpresa = document.getElementById('codigoEmpresa').value.trim().toUpperCase();

                    console.log("Tentando criar usuário no Auth...");
                    const cred = await createUserWithEmailAndPassword(auth, email, password);

                    // Se a pessoa digitou um código de empresa, validamos e vinculamos.
                    // Só é possível ler as empresas após autenticar; por isso validamos aqui.
                    // Código em branco = cadastro livre (o cliente informa o código pessoal à empresa depois).
                    let empresaId = null;
                    if (codigoEmpresa) {
                        try {
                            const qs = await getDocs(query(collection(db, "empresas"), where("codigoConvite", "==", codigoEmpresa)));
                            if (qs.empty) {
                                try { await deleteUser(cred.user); } catch (delErr) { console.error("Falha ao remover conta órfã:", delErr); }
                                alert("Código da empresa inválido. Confira com o seu consultor ou deixe em branco para se cadastrar sem código.");
                                return;
                            }
                            empresaId = qs.docs[0].id;
                        } catch (valErr) {
                            try { await deleteUser(cred.user); } catch (delErr) { console.error("Falha ao remover conta órfã:", delErr); }
                            alert("Não foi possível validar o código da empresa. Tente novamente em instantes.");
                            return;
                        }
                    }

                    console.log("Tentando salvar dados no Firestore...");
                    // Todo novo cadastro entra como "cliente" por padrão.
                    // codigoAcesso = código pessoal que o cliente informa à empresa para ser vinculado.
                    await setDoc(doc(db, "usuarios", cred.user.uid), {
                        nome: nome,
                        email: email,
                        telefone: telefone,
                        segmento: segmento,
                        faturamento: faturamento,
                        cep: cep,
                        cidade: cidade,
                        estado: estado,
                        role: "cliente",
                        empresaId: empresaId,
                        codigoAcesso: gerarCodigoAcesso(),
                        // Básicas ligadas; pagas/funcionário desligadas
                        funcionalidades: {
                            produtos: true, vendas: true,
                            fluxoCaixa: true, itensResolver: true, relatoriosHistorico: true,
                            calculoMargem: false, cvlCompleto: false, relatorios: false
                        }
                    });

                    // Avisa o administrador por e-mail sobre o novo cadastro
                    try {
                        await emailjs.send("service_yuf3qik", "template_ljx1rge", {
                            nome_usuario: nome,
                            email_usuario: email,
                            telefone_usuario: telefone,
                            segmento_usuario: segmento,
                            faturamento_usuario: faturamento,
                            cep_usuario: cep,
                            cidade_usuario: cidade,
                            estado_usuario: estado,
                            data_cadastro: new Date().toLocaleString("pt-BR")
                        });
                    } catch (mailErr) {
                        console.error("Falha ao enviar e-mail de aviso:", mailErr);
                    }

                    // Envia link de confirmação e não deixa entrar até confirmar
                    try { await sendEmailVerification(cred.user); } catch (ve) { console.error("Falha ao enviar verificação:", ve); }
                    await signOut(auth);
                    alert("Conta criada! Enviamos um link de confirmação para " + email + ".\n\nAbra seu e-mail (verifique também o spam), confirme e depois faça login.");
                    window.alternarModo(); // volta para o modo Login
                    return;
                } else {
                    console.log("Tentando fazer login...");
                    const cred = await signInWithEmailAndPassword(auth, email, password);

                    // Exige e-mail confirmado (master é isento)
                    if (!cred.user.emailVerified) {
                        const docSnap = await getDoc(doc(db, "usuarios", cred.user.uid));
                        const ehMaster = docSnap.exists() && docSnap.data().role === "master";
                        if (!ehMaster) {
                            try { await sendEmailVerification(cred.user); } catch (ve) {}
                            await signOut(auth);
                            alert("Seu e-mail ainda não foi confirmado. Reenviamos o link de confirmação para " + email + ".\n\nConfirme e tente entrar novamente.");
                            return;
                        }
                    }
                }
                window.location.href = "app.html";
            } catch (err) {
                console.error("Erro detalhado:", err);
                alert("Erro: " + err.message);
            }
        };
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] p-8 min-h-[100dvh] sm:min-h-0 flex flex-col justify-center sm:block sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950">
        <h2 id="titulo-topo" class="text-2xl font-black text-center mb-6 text-blue-950">Login</h2>
        
        <form onsubmit="handleAuth(event)" class="space-y-4">
            <div id="grupo-cadastro" style="display: none;" class="space-y-4">
                <input type="text" id="codigoEmpresa" placeholder="Código da empresa (opcional)" maxlength="6" oninput="this.value=this.value.toUpperCase()" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-orange-500 outline-none text-sm font-mono tracking-widest uppercase">
                <p class="text-[11px] text-slate-400 -mt-2 px-1">Tem um código da sua consultoria? Digite aqui. Se não tiver, deixe em branco — você receberá um código pessoal para informar a ela depois.</p>
                <input type="text" id="nome" placeholder="Nome completo" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <input type="tel" id="telefone" placeholder="Telefone (WhatsApp) ativo" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <input type="text" id="segmento" placeholder="Segmento da empresa (ex: Lanchonete)" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <input type="text" id="cep" placeholder="CEP" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <div class="flex gap-3">
                    <input type="text" id="cidade" placeholder="Cidade" class="flex-1 px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    <select id="estado" class="w-28 px-3 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-500">
                        <option value="">UF</option>
                        <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option>
                    </select>
                </div>
                <select id="faturamento" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-500">
                    <option value="">Faturamento médio mensal</option>
                    <option value="Até R$ 5.000">Até R$ 5.000</option>
                    <option value="R$ 5.000 a R$ 20.000">R$ 5.000 a R$ 20.000</option>
                    <option value="R$ 20.000 a R$ 50.000">R$ 20.000 a R$ 50.000</option>
                    <option value="R$ 50.000 a R$ 100.000">R$ 50.000 a R$ 100.000</option>
                    <option value="Acima de R$ 100.000">Acima de R$ 100.000</option>
                </select>
            </div>

            <div>
                <input type="email" id="email" placeholder="E-mail" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
            </div>

            <div>
                <input type="password" id="password" placeholder="Senha" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl transition cursor-pointer shadow-lg">
                Entrar
            </button>

            <div class="text-center">
                <button type="button" onclick="recuperarSenha()" class="text-xs text-blue-600 font-semibold underline cursor-pointer">Esqueci minha senha</button>
            </div>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            <span id="texto-alternativa">
                Não tem uma conta? <button type="button" onclick="alternarModo()" class="text-blue-600 font-semibold underline cursor-pointer">Criar conta</button>
            </span>
        </div>
    </div>

</body>
</html>
