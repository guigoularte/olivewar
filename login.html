<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.efetuarAcao = async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Tenta criar conta
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "usuarios", cred.user.uid), { nome: nome, email: email });
                window.location.href = "index.html";
            } catch (error) {
                // Se der erro (ex: já existe), tenta logar
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = "index.html";
                } catch (err) {
                    alert("Erro ao entrar: " + err.message);
                }
            }
        };
    </script>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm">
        <h2 class="text-xl font-bold text-center mb-6">Login / Cadastro</h2>
        
        <form onsubmit="efetuarAcao(event)" class="space-y-4">
            <input type="text" id="nome" placeholder="Seu Nome" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
            <input type="email" id="email" placeholder="E-mail" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
            <input type="password" id="password" placeholder="Senha" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
                Entrar
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-4">Ao entrar, você concorda com nossos termos.</p>
    </div>

</body>
</html>
