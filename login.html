<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50">

    <div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 flex flex-col items-center justify-between p-6">
      
      <!-- Cabeçalho -->
      <div class="flex flex-col items-center mt-8">
        <div class="bg-white p-3 rounded-full shadow-md mb-4">
          <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.115 6.448l-.054.09A13.916 13.916 0 0112 21c-1.292 0-2.536-.172-3.71-.492"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-blue-900 tracking-wide">OliveWar</h1>
        <p class="text-gray-600 text-center text-xs mt-1">Insira suas credenciais para acessar o ambiente beta.</p>
      </div>

      <!-- Formulário de Acesso (Cartão Branco) -->
      <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 flex flex-col my-auto">
        
        <form class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">E-mail</label>
            <input type="email" placeholder="seu.email@colega.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Senha</label>
            <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm bg-gray-50" required>
          </div>

          <div class="flex items-center justify-between text-xs text-gray-600">
            <label class="flex items-center">
              <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 mr-2"> Lembre-me
            </label>
            <a href="#" class="text-blue-600 hover:underline font-medium">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 text-sm mt-2 cursor-pointer">
            Entrar / Cadastrar
          </button>
        </form>

        <div class="mt-6 text-center">
          <a href="index.html" class="text-xs text-gray-500 hover:text-blue-600 transition">← Voltar para a página inicial</a>
        </div>
      </div>

      <!-- Rodapé simples -->
      <div class="text-center text-xs text-gray-400 mt-4">
        OliveWar Beta v1.0
      </div>

    </div>

</body>
</html>
