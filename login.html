<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OliveWar - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nome = document.getElementById('nome').value;

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "usuarios", cred.user.uid), { nome: nome, email: email });
                window.location.href = "index.html";
            } catch {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "index.html";
            }
        };
    </script>
</head>
<body class="bg-blue-50 p-8">
    <form onsubmit="handleAuth(event)" class="max-w-xs mx-auto bg-white p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="font-bold text-center">Login / Cadastro</h2>
        <input type="text" id="nome" placeholder="Seu Nome" class="w-full border p-2 rounded-lg" required>
        <input type="email" id="email" placeholder="E-mail" class="w-full border p-2 rounded-lg" required>
        <input type="password" id="password" placeholder="Senha" class="w-full border p-2 rounded-lg" required>
        <button class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold">Entrar</button>
    </form>
</body>
</html>
