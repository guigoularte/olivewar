<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Notas Fiscais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let meuUid = null, meuNome = "", empresaId = null, orgId = null, fotoPronta = "", arquivoTipo = "image";
        const lerDataURL = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsDataURL(file); });

        const brl = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const dataBR = (s) => { if (!s) return ""; const d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("pt-BR"); };
        // Data LOCAL (evita o bug de fuso do toISOString, que à noite vira o dia seguinte)
        const ymdLocal = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            meuUid = user.uid;
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const d = snap.exists() ? snap.data() : {};
            meuNome = d.nome || user.email || "";
            orgId = d.orgId || null;
            const fx = d.funcionalidades || {};
            if (!(d.role === "master" || fx.notasFiscais)) { alert("Esta funcionalidade não está disponível para a sua conta."); window.location.href = "app.html"; return; }
            // Resolve a empresa (consultoria) de destino
            if (orgId) { try { const o = await getDoc(doc(db, "organizacoes", orgId)); if (o.exists()) empresaId = o.data().empresaId || null; } catch (e) {} }
            else { empresaId = d.empresaId || null; }
            if (!empresaId) { document.getElementById('aviso').classList.remove('hidden'); return; }
            document.getElementById('form-wrap').classList.remove('hidden');
            await carregarMinhas();
        });

        function comprimirImagem(file, maxLado = 1200, qualidade = 0.65) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > height && width > maxLado) { height = height * maxLado / width; width = maxLado; }
                        else if (height > maxLado) { width = width * maxLado / height; height = maxLado; }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', qualidade));
                    };
                    img.onerror = reject; img.src = e.target.result;
                };
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

        window.selecionarFoto = async (input) => {
            const arq = input.files[0]; if (!arq) return;
            const st = document.getElementById('status-foto');
            const ehPdf = /pdf/i.test(arq.type) || /\.pdf$/i.test(arq.name || "");
            const ehImg = /^image\//.test(arq.type);
            if (!ehImg && !ehPdf) { st.innerText = "Envie uma foto (PNG/JPG) ou um PDF."; return; }
            st.innerText = ehPdf ? "Lendo PDF..." : "Processando foto...";
            try {
                if (ehImg) { fotoPronta = await comprimirImagem(arq); arquivoTipo = "image"; document.getElementById('preview').src = fotoPronta; document.getElementById('preview').classList.remove('hidden'); st.innerText = "Foto pronta ✓"; }
                else { const d = await lerDataURL(arq); if (d.length > 1300000) { fotoPronta = ""; st.innerText = "PDF muito grande (máx ~1MB)."; return; } fotoPronta = d; arquivoTipo = "pdf"; document.getElementById('preview').classList.add('hidden'); st.innerText = "PDF pronto ✓ — " + (arq.name || "arquivo"); }
            } catch (e) { st.innerText = "Não foi possível processar o arquivo."; }
        };

        window.enviar = async () => {
            if (!fotoPronta) { alert("Tire a foto ou escolha o PDF da nota fiscal."); return; }
            const fornecedor = document.getElementById('fornecedor').value.trim();
            const valor = parseFloat(String(document.getElementById('valor').value).replace(",", ".")) || 0;
            if (!fornecedor) { alert("Diga o que é esta nota (ex.: Hortifruti, Energia)."); document.getElementById('fornecedor').focus(); return; }
            if (valor <= 0) { alert("Informe o valor da compra."); document.getElementById('valor').focus(); return; }
            const btn = document.getElementById('btn-enviar'); btn.disabled = true; btn.innerText = "Enviando...";
            try {
                await addDoc(collection(db, "empresas", empresaId, "notas_fiscais"), {
                    foto: fotoPronta, arquivoTipo, fornecedor, valor,
                    obs: document.getElementById('obs').value.trim(),
                    clienteNome: meuNome, clienteId: meuUid, orgId: orgId || "",
                    enviadoPorUid: meuUid, enviadoPorNome: meuNome,
                    data: ymdLocal(), criadoEm: new Date().toISOString()
                });
                // Pré-lançamento em Contas a Pagar (para o cliente conciliar na home / fluxo de caixa)
                try {
                    await addDoc(collection(db, "usuarios", meuUid, "fluxo_caixa"), {
                        tipo: "saida", status: "pre_lancamento", origem: "nota",
                        descricao: fornecedor, valor,
                        categoria: "Fornecedor", data: ymdLocal(), vencimento: ymdLocal(),
                        temFoto: true, criadoEm: new Date().toISOString()
                    });
                } catch (e) { console.error("Falha ao criar pré-lançamento:", e); }
                fotoPronta = ""; arquivoTipo = "image";
                document.getElementById('preview').classList.add('hidden');
                document.getElementById('status-foto').innerText = "";
                ['fornecedor', 'valor', 'obs'].forEach(id => document.getElementById(id).value = "");
                document.getElementById('foto').value = "";
                alert("Nota enviada! Sua consultoria já pode ver.");
                await carregarMinhas();
            } catch (e) { alert("Erro ao enviar: " + e.message); }
            finally { btn.disabled = false; btn.innerText = "Enviar nota fiscal"; }
        };

        async function carregarMinhas() {
            const cont = document.getElementById('minhas');
            try {
                const s = await getDocs(query(collection(db, "empresas", empresaId, "notas_fiscais"), where("enviadoPorUid", "==", meuUid)));
                const notas = s.docs.map(d => d.data()).sort((a, b) => (b.criadoEm || "").localeCompare(a.criadoEm || "")).slice(0, 30);
                if (notas.length === 0) { cont.innerHTML = '<p class="text-xs text-slate-400 text-center py-3">Nenhuma nota enviada ainda.</p>'; return; }
                cont.innerHTML = notas.map(n => `
                    <div class="bg-white rounded-xl border border-slate-200 mb-2 p-2 flex gap-2">
                        <img src="${n.foto}" class="w-16 h-16 rounded-lg object-cover shrink-0">
                        <div class="min-w-0 text-xs">
                            <div class="font-bold text-slate-800 truncate">${esc(n.fornecedor) || "Nota fiscal"}</div>
                            <div class="text-slate-500">${dataBR(n.data)}${n.valor ? " · " + brl(n.valor) : ""}</div>
                            ${n.obs ? `<div class="text-[11px] text-slate-400 truncate">${esc(n.obs)}</div>` : ""}
                        </div>
                    </div>`).join('');
            } catch (e) { cont.innerHTML = '<p class="text-xs text-red-500 py-2">Erro ao carregar: ' + esc(e.message) + '</p>'; }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col p-6 overflow-hidden">
        <div class="overflow-y-auto flex-1">
            <div class="flex items-center justify-between mb-3">
                <a href="app.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-base font-black text-blue-950">Notas Fiscais</h1>
                <div class="w-8"></div>
            </div>

            <div id="aviso" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 text-[11px] text-amber-800">
                Você ainda não está vinculado a uma consultoria. Peça para vincularem sua conta antes de enviar notas.
            </div>

            <div id="form-wrap" class="hidden">
                <p class="text-[11px] text-slate-500 mb-3">Tire a foto da nota fiscal da sua compra e envie para a sua consultoria.</p>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-3 space-y-2 mb-4">
                    <label class="block text-center bg-blue-50 text-blue-700 font-bold py-3 rounded-xl cursor-pointer hover:bg-blue-100">
                        📷 Foto ou PDF da nota
                        <input type="file" id="foto" accept="image/*,application/pdf,.pdf" class="hidden" onchange="selecionarFoto(this)">
                    </label>
                    <p id="status-foto" class="text-[11px] text-slate-500 text-center"></p>
                    <img id="preview" class="hidden w-full max-h-56 object-contain rounded-lg border border-slate-100">
                    <input id="fornecedor" placeholder="O que é esta nota? (ex.: Hortifruti) *" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <input id="valor" type="number" step="0.01" placeholder="Valor da compra (R$) *" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <input id="obs" placeholder="Observação (opcional)" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="btn-enviar" onclick="enviar()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm">Enviar nota fiscal</button>
                </div>

                <p class="text-xs font-bold text-slate-700 mb-1">Minhas notas enviadas</p>
                <div id="minhas"></div>
            </div>
        </div>
    </div>
</body>
</html>
