<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Painel Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, getDoc, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Funcionalidades controláveis pelo master (padrao = ligado por padrão em novas contas)
        const FUNCS = [
            { chave: "produtos", label: "Produtos/Serviços", padrao: true },
            { chave: "vendas", label: "Vendas", padrao: true },
            { chave: "fluxoCaixa", label: "Fluxo de Caixa", padrao: true },
            { chave: "itensResolver", label: "Itens para Resolver", padrao: true },
            { chave: "relatoriosHistorico", label: "Relatórios (histórico)", padrao: true },
            { chave: "calculoMargem", label: "Cálculo de Margem", padrao: false },
            { chave: "cvlCompleto", label: "Cálculo de Margem Completo (CVL)", padrao: false },
            { chave: "relatorios", label: "Escrever Relatórios (funcionário)", padrao: false }
        ];
        // Valor efetivo: usa o que está salvo; se ausente, usa o padrão
        const temFunc = (func, f) => (f.chave in func) ? func[f.chave] : f.padrao;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }

            // Só o master acessa este painel
            const meu = await getDoc(doc(db, "usuarios", user.uid));
            if (!meu.exists() || meu.data().role !== "master") {
                alert("Acesso restrito ao administrador.");
                window.location.href = "app.html";
                return;
            }

            document.getElementById('conteudo').classList.remove('hidden');
            carregarUsuarios(user.uid);
        });

        let usuarios = [];
        let aba = "novos";
        let busca = "";
        // Categoria: definida pelo master. Sem definição = "novo".
        function categoriaDe(u) {
            if (u.categoria === "cliente" || u.categoria === "funcionario") return u.categoria;
            if (u.funcionalidades && u.funcionalidades.relatorios) return "funcionario";
            return "novo";
        }
        const ehFuncionario = (u) => categoriaDe(u) === "funcionario";
        const ROTULO = { novos: "novo(s)", clientes: "cliente(s)", funcionarios: "funcionário(s)" };

        async function carregarUsuarios(meuUid) {
            const snap = await getDocs(collection(db, "usuarios"));
            usuarios = [];
            snap.forEach((d) => { if (d.id !== meuUid && d.data().role !== "master") usuarios.push({ id: d.id, ...d.data() }); });
            render();
        }

        const tabCls = (ativo) => "flex-1 py-2 rounded-lg text-xs font-bold transition " + (ativo ? "bg-blue-600 text-white" : "bg-white text-slate-500 border border-slate-200");

        window.trocarAba = (a) => {
            aba = a;
            document.getElementById('busca').value = ""; busca = "";
            document.getElementById('tab-novos').className = tabCls(a === "novos");
            document.getElementById('tab-clientes').className = tabCls(a === "clientes");
            document.getElementById('tab-funcionarios').className = tabCls(a === "funcionarios");
            render();
        };
        window.buscar = (v) => { busca = (v || "").toLowerCase(); render(); };
        window.toggleCfg = (id) => { document.getElementById('cfg-' + id).classList.toggle('hidden'); };

        // Contadores das abas
        function atualizarContadores() {
            const cont = { novos: 0, clientes: 0, funcionarios: 0 };
            usuarios.forEach(u => { const c = categoriaDe(u); cont[c === "novo" ? "novos" : c === "cliente" ? "clientes" : "funcionarios"]++; });
            document.getElementById('tab-novos').innerText = "Novos (" + cont.novos + ")";
            document.getElementById('tab-clientes').innerText = "Clientes (" + cont.clientes + ")";
            document.getElementById('tab-funcionarios').innerText = "Funcionários (" + cont.funcionarios + ")";
        }

        function render() {
            atualizarContadores();
            const alvo = aba === "novos" ? "novo" : aba === "clientes" ? "cliente" : "funcionario";
            const lista = usuarios
                .filter(u => categoriaDe(u) === alvo)
                .filter(u => (u.nome || u.email || "").toLowerCase().includes(busca))
                .sort((a, b) => (a.nome || a.email || "").localeCompare(b.nome || b.email || "", "pt", { sensitivity: "base" }));
            const clientes = usuarios.filter(u => categoriaDe(u) === "cliente");
            const cont = document.getElementById('lista-usuarios');
            document.getElementById('contador').innerText = lista.length + " " + ROTULO[aba];
            if (lista.length === 0) { cont.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Nenhum registro nesta aba.</p>'; return; }
            cont.innerHTML = lista.map(u => cardHTML(u, clientes)).join('');
        }

        function cardHTML(u, clientes) {
            const func = u.funcionalidades || {};
            const cat = categoriaDe(u);
            const seletorCategoria = `
                <div class="mb-2">
                    <label class="text-[10px] font-semibold text-slate-400">Categoria do usuário</label>
                    <select onchange="definirCategoria('${u.id}', this.value)" class="w-full mt-1 p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
                        <option value="novo" ${cat === "novo" ? "selected" : ""}>Novo usuário (não definido)</option>
                        <option value="cliente" ${cat === "cliente" ? "selected" : ""}>Cliente</option>
                        <option value="funcionario" ${cat === "funcionario" ? "selected" : ""}>Funcionário</option>
                    </select>
                </div>`;

            const toggles = FUNCS.map(f => `
                <label class="flex items-center justify-between text-xs py-1">
                    <span class="text-slate-600">${f.label}</span>
                    <input type="checkbox" data-uid="${u.id}" data-func="${f.chave}"
                        ${temFunc(func, f) ? "checked" : ""} onchange="alternarFunc(this)"
                        class="w-9 h-5 accent-blue-600 cursor-pointer">
                </label>`).join('');

            let blocoClientes = '';
            if (ehFuncionario(u)) {
                const permitidos = u.clientesPermitidos || [];
                const opcoes = clientes.length === 0
                    ? '<p class="text-[10px] text-slate-400">Nenhum cliente cadastrado ainda.</p>'
                    : clientes.map(c => `
                        <label class="flex items-center justify-between text-xs py-1">
                            <span class="text-slate-600 truncate">${c.nome || c.email || "(sem nome)"}</span>
                            <input type="checkbox" onchange="alternarCliente('${u.id}','${c.id}',this.checked)"
                                ${permitidos.includes(c.id) ? "checked" : ""} class="w-9 h-5 accent-orange-500 cursor-pointer">
                        </label>`).join('');
                blocoClientes = `<details class="border-t border-slate-100 pt-2 mt-2">
                        <summary class="text-xs font-bold text-orange-600 cursor-pointer">🧑‍🤝‍🧑 Clientes atendidos</summary>
                        <p class="text-[10px] text-slate-400 mb-1 mt-1">Nenhum marcado = acesso a todos os clientes.</p>
                        ${opcoes}</details>`;
            }

            return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-2">
                <div class="flex items-center justify-between p-3">
                    <div class="min-w-0">
                        <div class="font-bold text-slate-800 text-sm truncate">${u.nome || "(sem nome)"}</div>
                        <div class="text-[11px] text-slate-500 truncate">${u.email || ""}</div>
                    </div>
                    <button onclick="toggleCfg('${u.id}')" title="Configurar" class="ml-2 shrink-0 w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-base">⚙️</button>
                </div>
                <div id="cfg-${u.id}" class="hidden border-t border-slate-100 p-3">
                    ${seletorCategoria}
                    <p class="text-[10px] font-semibold text-slate-400 mb-1 border-t border-slate-100 pt-2">Funcionalidades liberadas</p>
                    ${toggles}
                    ${blocoClientes}
                    <a href="fluxo_caixa.html?uid=${u.id}" class="block text-center mt-2 bg-emerald-50 text-emerald-700 text-xs font-semibold py-1.5 rounded-lg hover:bg-emerald-100">👁 Ver Fluxo de Caixa</a>
                </div>
            </div>`;
        }

        // Define a categoria do usuário (novo/cliente/funcionário)
        window.definirCategoria = async (uid, cat) => {
            const updates = { categoria: cat };
            // Funcionário precisa poder escrever relatórios; cliente não
            if (cat === "funcionario") updates["funcionalidades.relatorios"] = true;
            if (cat === "cliente") updates["funcionalidades.relatorios"] = false;
            try {
                await updateDoc(doc(db, "usuarios", uid), updates);
                const u = usuarios.find(x => x.id === uid);
                if (u) {
                    u.categoria = cat;
                    u.funcionalidades = u.funcionalidades || {};
                    if (cat === "funcionario") u.funcionalidades.relatorios = true;
                    if (cat === "cliente") u.funcionalidades.relatorios = false;
                }
                render();
            } catch (err) { alert("Erro ao definir categoria: " + err.message); }
        };

        // Atribui/remove um cliente da lista de atendimento do funcionário
        window.alternarCliente = async (funcUid, clienteUid, marcado) => {
            try {
                await updateDoc(doc(db, "usuarios", funcUid), {
                    clientesPermitidos: marcado ? arrayUnion(clienteUid) : arrayRemove(clienteUid)
                });
                const u = usuarios.find(x => x.id === funcUid);
                if (u) { u.clientesPermitidos = u.clientesPermitidos || []; if (marcado) u.clientesPermitidos.push(clienteUid); else u.clientesPermitidos = u.clientesPermitidos.filter(x => x !== clienteUid); }
            } catch (err) { alert("Erro ao atualizar clientes: " + err.message); }
        };

        // Liga/desliga uma funcionalidade de um usuário
        window.alternarFunc = async (input) => {
            const uid = input.dataset.uid;
            const chave = input.dataset.func;
            input.disabled = true;
            try {
                await updateDoc(doc(db, "usuarios", uid), { [`funcionalidades.${chave}`]: input.checked });
                const u = usuarios.find(x => x.id === uid);
                if (u) { u.funcionalidades = u.funcionalidades || {}; u.funcionalidades[chave] = input.checked; }
                // Ligar "Escrever Relatórios" transforma em funcionário → muda de aba
                if (chave === "relatorios") render();
            } catch (err) {
                alert("Erro ao atualizar: " + err.message);
                input.checked = !input.checked;
            } finally {
                input.disabled = false;
            }
        };
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col justify-between p-6 overflow-hidden">
        <div id="conteudo" class="hidden overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <a href="app.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-lg font-black text-blue-950">Painel Master</h1>
                <div class="w-8"></div>
            </div>

            <a href="empresas.html" class="flex items-center justify-center gap-2 mb-2 bg-orange-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-orange-700 transition">
                🏢 Empresas (convites e migração)
            </a>
            <a href="admin_atividades.html" class="flex items-center justify-center gap-2 mb-2 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-emerald-700 transition">
                🔔 Atividades recentes dos clientes
            </a>
            <a href="admin_relatorios.html" class="flex items-center justify-center gap-2 mb-4 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition">
                📋 Ver todos os relatórios dos funcionários
            </a>

            <!-- Abas -->
            <div class="flex gap-1.5 mb-2">
                <button id="tab-novos" onclick="trocarAba('novos')" class="flex-1 py-2 rounded-lg text-xs font-bold transition bg-blue-600 text-white">Novos</button>
                <button id="tab-clientes" onclick="trocarAba('clientes')" class="flex-1 py-2 rounded-lg text-xs font-bold transition bg-white text-slate-500 border border-slate-200">Clientes</button>
                <button id="tab-funcionarios" onclick="trocarAba('funcionarios')" class="flex-1 py-2 rounded-lg text-xs font-bold transition bg-white text-slate-500 border border-slate-200">Funcionários</button>
            </div>

            <!-- Busca -->
            <input id="busca" oninput="buscar(this.value)" placeholder="🔍 Procurar pelo nome..." class="w-full p-2.5 border rounded-xl text-sm mb-2 outline-none focus:ring-2 focus:ring-blue-500">
            <p id="contador" class="text-[11px] text-slate-500 mb-2">Carregando...</p>

            <div id="lista-usuarios" class="space-y-2"></div>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="configuracoes.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></a>
            <a href="perfil.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
