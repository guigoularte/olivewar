<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY",
            authDomain: "olivewar-1e5e2.firebaseapp.com",
            projectId: "olivewar-1e5e2",
            storageBucket: "olivewar-1e5e2.firebasestorage.app",
            messagingSenderId: "437889793363",
            appId: "1:437889793363:web:508e445177eb06f6e435a6",
            measurementId: "G-GGB4C2X6TL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Busca o lead mais recente desse usuário
                const leadsRef = collection(db, "usuarios", user.uid, "leads");
                const q = query(leadsRef, orderBy("dataEnvio", "desc"), limit(1));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const lead = querySnapshot.docs[0].data();
                    document.getElementById('nome-usuario').innerText = user.email;
                    document.getElementById('nome-empresa').innerText = lead.empresa;
                    document.getElementById('nome-produto').innerText = lead.produto;
                }
            } else {
                window.location.href = "login.html";
            }
        });

        window.logout = async () => {
            await signOut(auth);
            window.location.href = "login.html";
        };
    </script>
</head>
<body class="bg-blue-50 p-6">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-blue-900 mb-6">Olá, bem-vindo!</h1>
        
        <div class="space-y-4">
            <div class="p-4 bg-blue-50 rounded-xl">
                <p class="text-xs text-gray-500 uppercase font-bold">Seu E-mail</p>
                <p id="nome-usuario" class="text-blue-900 font-semibold">Carregando...</p>
            </div>
            <div class="p-4 bg-blue-50 rounded-xl">
                <p class="text-xs text-gray-500 uppercase font-bold">Empresa</p>
                <p id="nome-empresa" class="text-blue-900 font-semibold">Aguardando cadastro...</p>
            </div>
            <div class="p-4 bg-blue-50 rounded-xl">
                <p class="text-xs text-gray-500 uppercase font-bold">Produto Cadastrado</p>
                <p id="nome-produto" class="text-blue-900 font-semibold">Aguardando cadastro...</p>
            </div>
        </div>

        <div class="mt-8 flex gap-4">
            <a href="newleads.html" class="flex-1 bg-blue-600 text-white text-center py-3 rounded-xl font-semibold">Novo Lead</a>
            <button onclick="logout()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold">Sair</button>
        </div>
    </div>
</body>
</html>
