<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliveWar - Central</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY",
            authDomain: "olivewar-1e5e2.firebaseapp.com",
            projectId: "olivewar-1e5e2",
            storageBucket: "olivewar-1e5e2.firebasestorage.app",
            messagingSenderId: "437889793363",
            appId: "1:437889793363:web:508e445177eb06f6e435a6",
            measurementId: "G-GGB4C2X6TL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById('display-email').innerText = user.email;

            // Busca os dados do lead
            try {
                const leadsRef = collection(db, "usuarios", user.uid, "leads");
                const q = query(leadsRef, orderBy("dataEnvio", "desc"), limit(1));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const lead = querySnapshot.docs[0].data();
                    document.getElementById('display-empresa').innerText = lead.empresa;
                    document.getElementById('display-produto').innerText = lead.produto;
                } else {
                    document.getElementById('display-empresa').innerText = "Nenhuma empresa cadastrada";
                    document.getElementById('display-produto').innerText = "Nenhum produto registrado";
                }
            } catch (e) {
                console.error("Erro ao buscar dados:", e);
            }
        });

        window.logout = () => { signOut(auth); window.location.href = "login.html"; };
    </script>
</head>
<body class="bg-slate-50 min-h-screen p-6">

    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">Olá, bem-vindo!</h1>
            <p id="display-email" class="text-slate-500 text-sm"></p>
        </div>

        <div class="space-y-6">
            <!-- Card de Dados -->
            <div class="border-l-4 border-blue-600 bg-blue-50/50 p-4 rounded-r-xl">
                <p class="text-xs font-bold text-blue-600 uppercase tracking-wider">Empresa</p>
                <p id="display-empresa" class="text-lg font-semibold text-slate-800">Carregando...</p>
            </div>

            <div class="border-l-4 border-emerald-500 bg-emerald-50/50 p-4 rounded-r-xl">
                <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Produto Principal</p>
                <p id="display-produto" class="text-lg font-semibold text-slate-800">Carregando...</p>
            </div>
        </div>

        <!-- Ações -->
        <div class="mt-10 flex flex-col gap-3">
            <a href="newleads.html" class="w-full bg-slate-900 text-white text-center py-3.5 rounded-xl font-bold hover:bg-slate-800 transition">
                + Cadastrar novo produto
            </a>
            <a href="newleads.html" class="w-full border border-slate-300 text-slate-600 text-center py-3.5 rounded-xl font-semibold hover:bg-slate-50 transition">
                Alterar/Atualizar dados
            </a>
            <button onclick="logout()" class="text-slate-400 text-xs mt-4 underline">Sair da conta</button>
        </div>
    </div>

</body>
</html>
