<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OliveWar - Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            const userSnap = await getDoc(doc(db, "usuarios", user.uid));
            document.getElementById('display-nome').innerText = userSnap.data().nome;

            const prods = await getDocs(collection(db, "usuarios", user.uid, "produtos"));
            const lista = document.getElementById('lista-produtos');
            prods.forEach(p => {
                lista.innerHTML += `<div class="p-4 bg-white border rounded-xl flex justify-between">
                    ${p.data().nomeProduto} <a href="cadastro_produto.html?id=${p.id}">✏️</a>
                </div>`;
            });
        });
    </script>
</head>
<body class="bg-slate-50 p-8">
    <h1 class="text-xl font-bold">Olá, <span id="display-nome">...</span></h1>
    <div id="lista-produtos" class="space-y-3 my-6"></div>
    <a href="cadastro_produto.html" class="block bg-slate-900 text-white text-center p-3 rounded-lg font-bold">+ Cadastrar Produto</a>
    <a href="newleads.html" class="block bg-blue-600 text-white text-center p-3 rounded-lg font-bold mt-3">Formulário de Contato (Leads)</a>
</body>
</html>
