<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                // Busca o nome salvo no Firestore
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().nome) {
                    const primeiroNome = docSnap.data().nome.trim().split(" ")[0];
                    document.getElementById('nome-usuario').innerText = `Olá, ${primeiroNome}`;
                } else {
                    document.getElementById('nome-usuario').innerText = "Olá, Usuário";
                }

                // Controle de acesso por funcionalidade (definido pelo master)
                const dados = docSnap.exists() ? docSnap.data() : {};
                const ehMaster = dados.role === "master";
                const func = dados.funcionalidades || {};

                // Guarda permissões e nome para a barra lateral (desktop) de todas as telas
                localStorage.setItem('oliverPerms', JSON.stringify({ master: ehMaster, func: func }));
                localStorage.setItem('oliverNome', (dados.nome || "Usuário").trim().split(" ")[0]);

                // Mapa de funcionalidades -> card do menu (padrao = ligado por padrão)
                const FEATS = [
                    { id: 'menu-relatorios', key: 'relatorios', padrao: false },
                    { id: 'menu-itens', key: 'itensResolver', padrao: true },
                    { id: 'menu-relhist', key: 'relatoriosHistorico', padrao: true },
                    { id: 'menu-fluxo', key: 'fluxoCaixa', padrao: true },
                    { id: 'menu-produtos', key: 'produtos', padrao: true },
                    { id: 'menu-vendas', key: 'vendas', padrao: true },
                    { id: 'menu-margem', key: 'calculoMargem', padrao: false },
                    { id: 'menu-cvl', key: 'cvlCompleto', padrao: false }
                ];
                FEATS.forEach((f) => {
                    const el = document.getElementById(f.id);
                    if (!el) return;
                    const permitido = ehMaster || ((f.key in func) ? func[f.key] : f.padrao);
                    el.style.display = permitido ? 'flex' : 'none';
                });
                // Painel Master só para o master
                const elAdmin = document.getElementById('menu-admin');
                if (elAdmin) elAdmin.style.display = ehMaster ? 'flex' : 'none';
            } catch (error) {
                console.error("Erro ao buscar nome:", error);
                document.getElementById('nome-usuario').innerText = "Olá, Usuário";
            }
        });

        window.fazerLogout = async () => {
            await signOut(auth);
            window.location.href = "login.html";
        };
    </script>
</head>
