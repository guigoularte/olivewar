<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagens — Oliver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',system-ui,sans-serif}</style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const corDe = (nome) => { const cores = ["#4f46e5", "#0d9488", "#be185d", "#b45309", "#7c3aed", "#0369a1"]; let h = 0; for (const c of (nome || "?")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return cores[h % cores.length]; };
        const horaDe = (iso) => { try { const d = new Date(iso); return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
        const diaDe = (iso) => { try { return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }); } catch (e) { return ""; } };

        let empresaId = null, meuUid = null, meuNome = "";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { location.href = "login.html"; return; }
            meuUid = user.uid;
            const uSnap = await getDoc(doc(db, "usuarios", user.uid));
            const u = uSnap.exists() ? uSnap.data() : {};
            meuNome = u.nome || "Eu";
            const ehEquipe = u.role === "master" || u.role === "empresa_admin" || (u.funcionalidades && u.funcionalidades.relatorios === true);
            empresaId = u.empresaId || null;
            if (!ehEquipe || !empresaId) {
                document.getElementById("lista").innerHTML = `<div class="text-center text-slate-400 text-sm py-10">As mensagens da equipe são só para consultores da empresa.</div>`;
                document.getElementById("barra-envio").classList.add("hidden");
                return;
            }
            iniciarChat();
        });

        function iniciarChat() {
            const lista = document.getElementById("lista");
            const q = query(collection(db, "empresas", empresaId, "mensagens"), orderBy("criadoEm", "desc"), limit(200));
            onSnapshot(q, (snap) => {
                const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
                render(msgs);
            }, (err) => { console.error(err); lista.innerHTML = `<div class="text-center text-rose-500 text-sm py-10">Erro ao carregar mensagens: ${esc(err.message)}</div>`; });

            const input = document.getElementById("txt");
            const btn = document.getElementById("enviar");
            const enviar = async () => {
                const texto = input.value.trim();
                if (!texto) return;
                input.value = ""; input.style.height = "auto"; input.focus();
                try {
                    await addDoc(collection(db, "empresas", empresaId, "mensagens"), {
                        texto, autorUid: meuUid, autorNome: meuNome, criadoEm: new Date().toISOString()
                    });
                    // Notifica os outros da equipe por push (best-effort)
                    try {
                        const tk = await auth.currentUser.getIdToken();
                        fetch("/api/notificar-mensagem", { method: "POST", headers: { "Authorization": "Bearer " + tk, "Content-Type": "application/json" }, body: JSON.stringify({ texto }) }).catch(() => {});
                    } catch (e) {}
                } catch (e) { alert("Não foi possível enviar: " + e.message); input.value = texto; }
            };
            btn.addEventListener("click", enviar);
            input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } });
            input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; });
        }

        function render(msgs) {
            const lista = document.getElementById("lista");
            if (!msgs.length) { lista.innerHTML = `<div class="text-center text-slate-400 text-sm py-10"><i class="fa-regular fa-comments text-2xl mb-2 block"></i>Nenhuma mensagem ainda.<br>Mande a primeira para a equipe!</div>`; return; }
            let html = ""; let ultimoDia = "";
            msgs.forEach((m) => {
                const dia = diaDe(m.criadoEm);
                if (dia !== ultimoDia) { ultimoDia = dia; html += `<div class="flex justify-center my-3"><span class="text-[10px] font-semibold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">${dia}</span></div>`; }
                const meu = m.autorUid === meuUid;
                if (meu) {
                    html += `<div class="flex justify-end mb-1.5"><div class="max-w-[78%] bg-orange-500 text-white rounded-2xl rounded-br-md px-3.5 py-2 shadow-sm">
                        <p class="text-[14px] whitespace-pre-wrap break-words">${esc(m.texto)}</p>
                        <p class="text-[10px] text-orange-100 text-right mt-0.5">${horaDe(m.criadoEm)}</p></div></div>`;
                } else {
                    html += `<div class="flex justify-start mb-1.5 items-end gap-1.5">
                        <div class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[11px] font-bold shrink-0" style="background:${corDe(m.autorNome)}">${esc((m.autorNome || "?")[0].toUpperCase())}</div>
                        <div class="max-w-[78%] bg-white border border-slate-200 rounded-2xl rounded-bl-md px-3.5 py-2 shadow-sm">
                        <p class="text-[11px] font-bold mb-0.5" style="color:${corDe(m.autorNome)}">${esc(m.autorNome || "—")}</p>
                        <p class="text-[14px] text-slate-800 whitespace-pre-wrap break-words">${esc(m.texto)}</p>
                        <p class="text-[10px] text-slate-400 text-right mt-0.5">${horaDe(m.criadoEm)}</p></div></div>`;
                }
            });
            lista.innerHTML = html;
            lista.scrollTop = lista.scrollHeight;
        }
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-slate-50 min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col overflow-hidden">
        <!-- Cabeçalho -->
        <header class="bg-orange-600 text-white px-4 py-3 shrink-0 shadow-md flex items-center gap-3">
            <a href="app.html" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/15"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="flex-1">
                <h1 class="font-bold text-base leading-none">Mensagens da equipe</h1>
                <p class="text-[11px] text-orange-100 mt-0.5">Conversa interna da consultoria</p>
            </div>
            <i class="fa-solid fa-users text-orange-200"></i>
        </header>

        <!-- Lista de mensagens -->
        <main id="lista" class="flex-1 overflow-y-auto p-3.5" style="-webkit-overflow-scrolling:touch">
            <div class="text-center text-slate-400 text-sm py-10">Carregando mensagens…</div>
        </main>

        <!-- Barra de envio -->
        <div id="barra-envio" class="shrink-0 border-t border-slate-200 bg-white p-2.5 flex items-end gap-2">
            <textarea id="txt" rows="1" placeholder="Escreva uma mensagem…" class="flex-1 resize-none px-3.5 py-2.5 border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-orange-300 max-h-[120px]"></textarea>
            <button id="enviar" class="w-11 h-11 shrink-0 bg-orange-500 hover:bg-orange-600 text-white rounded-full flex items-center justify-center shadow-sm"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
    <script src="oliver_ui.js"></script>
</body>
</html>
