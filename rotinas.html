<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Rotinas Operacionais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc, deleteDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let meuUid = null, meuNome = "", isConsultoria = false, minhaEmpresa = null;
        let orgIdAtual = null, podeEditar = false;
        let rotinas = [], feitosHoje = {};
        const hoje = new Date().toISOString().slice(0, 10);
        const MOMENTOS = ["Abertura", "Durante o dia", "Fechamento", "Geral"];

        const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            meuUid = user.uid;
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const d = snap.exists() ? snap.data() : {};
            meuNome = d.nome || user.email || "";
            isConsultoria = d.role === "master" || d.role === "empresa_admin" || (d.funcionalidades && d.funcionalidades.relatorios === true);
            minhaEmpresa = d.empresaId || null;

            if (isConsultoria) {
                // Consultor escolhe a organização
                document.getElementById('bloco-sel').classList.remove('hidden');
                const sel = document.getElementById('org-sel');
                try {
                    if (minhaEmpresa) {
                        const os = await getDocs(query(collection(db, "organizacoes"), where("empresaId", "==", minhaEmpresa)));
                        os.forEach(o => { const opt = document.createElement('option'); opt.value = o.id; opt.textContent = o.data().nome || "(organização)"; sel.appendChild(opt); });
                    }
                } catch (e) { console.error(e); }
                document.getElementById('conteudo').classList.remove('hidden');
            } else if (d.orgId) {
                orgIdAtual = d.orgId;
                try { const o = await getDoc(doc(db, "organizacoes", d.orgId)); if (o.exists()) podeEditar = (o.data().gerenteUid === user.uid); } catch (e) {}
                document.getElementById('conteudo').classList.remove('hidden');
                await carregar();
            } else {
                alert("As rotinas são por organização. Você ainda não faz parte de uma.");
                window.location.href = "app.html"; return;
            }
        });

        window.trocarOrg = async () => {
            orgIdAtual = document.getElementById('org-sel').value || null;
            podeEditar = isConsultoria && !!orgIdAtual;   // consultor edita qualquer org da empresa
            if (!orgIdAtual) { document.getElementById('lista').innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Escolha uma organização.</p>'; document.getElementById('form-rotina').style.display = 'none'; return; }
            await carregar();
        };

        async function carregar() {
            try {
                const [rs, ds] = await Promise.all([
                    getDocs(collection(db, "organizacoes", orgIdAtual, "rotinas")),
                    getDoc(doc(db, "organizacoes", orgIdAtual, "rotinas_dia", hoje))
                ]);
                rotinas = rs.docs.map(x => ({ id: x.id, ...x.data() }));
                rotinas.sort((a, b) => (MOMENTOS.indexOf(a.momento || "Geral") - MOMENTOS.indexOf(b.momento || "Geral")) || (a.nome || "").localeCompare(b.nome || "", "pt"));
                feitosHoje = ds.exists() ? (ds.data().feitos || {}) : {};
            } catch (e) { alert("Erro ao carregar rotinas: " + e.message); return; }
            render();
        }

        window.toggleForm = () => { const el = document.getElementById('form-rotina'); el.style.display = el.style.display === "block" ? "none" : "block"; };

        function render() {
            document.getElementById('btn-nova').style.display = podeEditar ? "block" : "none";
            document.getElementById('dica').style.display = podeEditar ? "block" : "none";
            const cont = document.getElementById('lista');
            if (rotinas.length === 0) {
                cont.innerHTML = podeEditar
                    ? '<p class="text-xs text-slate-400 text-center py-6">Nenhuma rotina ainda. Crie a primeira (ex: "Abertura" com os passos ao chegar).</p>'
                    : '<p class="text-xs text-slate-400 text-center py-6">Nenhuma rotina definida ainda para esta loja.</p>';
                return;
            }
            cont.innerHTML = rotinas.map(r => {
                const itens = r.itens || [];
                const fe = feitosHoje[r.id] || {};
                const feitos = itens.filter((_, i) => fe[i]).length;
                return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-3 p-3">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="font-bold text-slate-800 text-sm">${esc(r.nome)}</div>
                            <div class="text-[10px] text-slate-400">${esc(r.momento || "Geral")} · ${feitos}/${itens.length} feito(s) hoje</div>
                        </div>
                        ${podeEditar ? `<button onclick="excluirRotina('${r.id}')" class="text-red-400 hover:text-red-600 text-sm shrink-0">🗑</button>` : ""}
                    </div>
                    <div class="mt-2 space-y-1">
                        ${itens.map((it, i) => `
                            <label class="flex items-center gap-2 text-sm ${fe[i] ? 'text-slate-400 line-through' : 'text-slate-700'}">
                                <input type="checkbox" ${fe[i] ? "checked" : ""} onchange="marcar('${r.id}',${i},this.checked)" class="w-5 h-5 accent-emerald-600 cursor-pointer shrink-0">
                                <span>${esc(it.descricao || it)}</span>
                            </label>`).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        window.marcar = async (rotinaId, idx, valor) => {
            try {
                await setDoc(doc(db, "organizacoes", orgIdAtual, "rotinas_dia", hoje),
                    { data: hoje, atualizadoEm: new Date().toISOString(), atualizadoPor: meuNome, feitos: { [rotinaId]: { [idx]: valor } } },
                    { merge: true });
                feitosHoje[rotinaId] = feitosHoje[rotinaId] || {};
                feitosHoje[rotinaId][idx] = valor;
                render();
            } catch (e) { alert("Erro ao marcar: " + e.message); }
        };

        window.criarRotina = async () => {
            const nome = document.getElementById('r-nome').value.trim();
            const linhas = document.getElementById('r-itens').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            if (!nome) { alert("Dê um nome à rotina."); return; }
            if (linhas.length === 0) { alert("Escreva ao menos um item (um por linha)."); return; }
            try {
                await addDoc(collection(db, "organizacoes", orgIdAtual, "rotinas"), {
                    nome, momento: document.getElementById('r-momento').value,
                    itens: linhas.map(l => ({ descricao: l })),
                    criadoPor: meuNome, criadoEm: new Date().toISOString()
                });
                document.getElementById('r-nome').value = ""; document.getElementById('r-itens').value = "";
                document.getElementById('form-rotina').style.display = "none";
                await carregar();
            } catch (e) { alert("Erro ao criar rotina: " + e.message); }
        };

        window.excluirRotina = async (id) => {
            if (!confirm("Excluir esta rotina?")) return;
            try { await deleteDoc(doc(db, "organizacoes", orgIdAtual, "rotinas", id)); await carregar(); }
            catch (e) { alert("Erro: " + e.message); }
        };
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col p-6 overflow-hidden">
        <div id="conteudo" class="hidden overflow-y-auto flex-1">
            <div class="flex items-center justify-between mb-3">
                <a href="app.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-base font-black text-blue-950">Rotinas</h1>
                <div class="w-8"></div>
            </div>
            <p class="text-[11px] text-slate-500 mb-2">O que fazer no dia de trabalho. A lista se repete todo dia — marque conforme for fazendo.</p>

            <div id="bloco-sel" class="hidden mb-2">
                <label class="text-xs font-semibold text-slate-600">Organização</label>
                <select id="org-sel" onchange="trocarOrg()" class="w-full mt-1 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Selecione…</option>
                </select>
            </div>

            <button id="btn-nova" onclick="toggleForm()" style="display:none" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 rounded-lg mb-2">+ Nova rotina</button>
            <div id="form-rotina" style="display:none" class="bg-white rounded-xl border border-slate-200 p-3 mb-3 space-y-2">
                <input id="r-nome" placeholder="Nome (ex: Abertura da loja)" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <select id="r-momento" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option>Abertura</option><option>Durante o dia</option><option>Fechamento</option><option>Geral</option>
                </select>
                <textarea id="r-itens" rows="5" placeholder="Um item por linha. Ex:&#10;Ligar fritadeira&#10;Conferir estoque&#10;Limpar o balcão" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <button onclick="criarRotina()" class="w-full bg-blue-600 text-white text-sm font-bold py-2 rounded-lg">Salvar rotina</button>
            </div>
            <p id="dica" style="display:none" class="text-[10px] text-slate-400 mb-2">Você (consultor) ou o gerente da loja podem criar/editar as rotinas.</p>

            <div id="lista"></div>
        </div>
    </div>
</body>
</html>
