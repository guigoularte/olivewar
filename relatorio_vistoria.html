<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Relatório de Vistoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="oliver_pdf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>emailjs.init({ publicKey: "Jwl7iLqUNND6syxRU" });</script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, getDocs, getDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // Persistência offline: grava no aparelho e sincroniza quando a internet voltar
        const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

        // EmailJS (reutiliza o mesmo serviço; crie um template de relatórios)
        const EMAIL_SERVICE = "service_yuf3qik";
        const EMAIL_TEMPLATE = "template_r7hf9fm";

        let usuarioAtual = null, nomeFuncionario = "", itens = [], clientesPermitidos = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            usuarioAtual = user;
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const dados = snap.exists() ? snap.data() : {};
            const permitido = dados.role === "master" || (dados.funcionalidades && dados.funcionalidades.relatorios);
            if (!permitido) { alert("Esta funcionalidade não está disponível no seu plano."); window.location.href = "app.html"; return; }
            nomeFuncionario = dados.nome || user.email;
            clientesPermitidos = (dados.role === "master") ? [] : (dados.clientesPermitidos || []);
            document.getElementById('conteudo').classList.remove('hidden');
            carregarClientes();
        });

        async function carregarClientes() {
            const select = document.getElementById('cliente');
            try {
                const snap = await getDocs(collection(db, "usuarios"));
                let qtd = 0;
                snap.forEach((d) => {
                    if (d.id === usuarioAtual.uid) return;
                    const u = d.data();
                    if (u.role === "master") return;
                    if (clientesPermitidos.length && !clientesPermitidos.includes(d.id)) return;
                    const opt = document.createElement('option');
                    opt.value = d.id; opt.textContent = `${u.nome || "(sem nome)"} — ${u.email || ""}`;
                    select.appendChild(opt); qtd++;
                });
                if (qtd === 0) document.getElementById('aviso-clientes').innerText = "Nenhum cliente cadastrado ainda.";
            } catch (err) {
                document.getElementById('aviso-clientes').innerText = "Erro ao carregar clientes: " + err.message + " (verifique se as regras do Firestore foram publicadas).";
            }
        }

        function comprimirImagem(file, maxLado = 900, qualidade = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > height && width > maxLado) { height = height * maxLado / width; width = maxLado; }
                        else if (height > maxLado) { width = width * maxLado / height; height = maxLado; }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', qualidade));
                    };
                    img.onerror = reject; img.src = e.target.result;
                };
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

        window.adicionarItem = async () => {
            const descricao = document.getElementById('descricao').value.trim();
            const arquivo = document.getElementById('foto').files[0];
            if (!descricao) { alert("Escreva a anotação do item."); return; }
            let foto = "";
            if (arquivo) {
                document.getElementById('btn-add').innerText = "Processando foto...";
                try { foto = await comprimirImagem(arquivo); } catch (e) { alert("Não foi possível processar a foto."); }
                document.getElementById('btn-add').innerText = "+ Adicionar item";
            }
            itens.push({ descricao, foto });
            document.getElementById('descricao').value = ""; document.getElementById('foto').value = "";
            renderItens();
        };

        window.removerItem = (i) => { itens.splice(i, 1); renderItens(); };

        function renderItens() {
            const lista = document.getElementById('lista-itens');
            lista.innerHTML = '';
            itens.forEach((it, i) => {
                lista.innerHTML += `<div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-sm">
                    <div class="flex justify-between items-start gap-2">
                        <p class="text-slate-700 flex-1">${it.descricao}</p>
                        <button onclick="removerItem(${i})" class="text-red-500 font-bold">&times;</button>
                    </div>
                    ${it.foto ? `<img src="${it.foto}" class="mt-2 rounded-lg w-full max-h-40 object-cover">` : ''}
                </div>`;
            });
            document.getElementById('contador').innerText = itens.length;
        }

        function gerarPDF(clienteNome, listaItens) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            let y = oliverPdfHeader(pdf, "Relatório de Vistoria", clienteNome || "");
            pdf.setFontSize(11); pdf.setTextColor(0, 0, 0);
            pdf.text(`Cliente: ${clienteNome}`, 14, y); y += 6;
            pdf.text(`Funcionário: ${nomeFuncionario}`, 14, y); y += 6;
            pdf.setFontSize(9); pdf.setTextColor(120, 120, 120);
            pdf.text(`Gerado em ${new Date().toLocaleString("pt-BR")}`, 14, y); y += 10;
            listaItens.forEach((it, idx) => {
                if (y > 250) { pdf.addPage(); y = 20; }
                pdf.setFontSize(11); pdf.setTextColor(0, 0, 0);
                const linhas = pdf.splitTextToSize(`${idx + 1}. ${it.descricao || ""}`, 180);
                pdf.text(linhas, 14, y); y += linhas.length * 6;
                if (it.foto) { if (y > 210) { pdf.addPage(); y = 20; } try { pdf.addImage(it.foto, "JPEG", 14, y, 60, 45); y += 50; } catch (e) { y += 2; } }
                y += 4;
            });
            oliverPdfFooter(pdf);
            return pdf;
        }

        async function compartilharPDF(pdf, nomeArq, texto) {
            try {
                const blob = pdf.output("blob");
                const file = new File([blob], nomeArq, { type: "application/pdf" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: "Relatório de Vistoria", text: texto });
                    return;
                }
            } catch (e) { console.log("Compartilhamento cancelado:", e); }
            pdf.save(nomeArq);
        }

        async function enviarEmailAdmin(clienteNome, listaItens, novoCliente) {
            let conteudo = "";
            if (novoCliente) {
                conteudo += "⚠️ NOVO CLIENTE (não cadastrado):\n"
                    + "Empresa: " + novoCliente.empresa + "\n"
                    + "Atendido por: " + (novoCliente.atendente || "-") + "\n"
                    + "WhatsApp: " + (novoCliente.whatsapp || "-") + "\n\n";
            }
            conteudo += listaItens.map((it, i) => `${i + 1}. ${it.descricao}`).join("\n");
            try {
                await emailjs.send(EMAIL_SERVICE, EMAIL_TEMPLATE, {
                    tipo_relatorio: novoCliente ? "Relatório de Vistoria (NOVO CLIENTE)" : "Relatório de Vistoria",
                    funcionario: nomeFuncionario,
                    cliente: clienteNome,
                    conteudo: conteudo,
                    data: new Date().toLocaleString("pt-BR")
                });
            } catch (e) { console.error("Falha ao enviar e-mail ao admin:", e); }
        }

        window.toggleNovoCliente = () => {
            const ehNovo = document.getElementById('novo-cliente-check').checked;
            document.getElementById('bloco-novo-cliente').classList.toggle('hidden', !ehNovo);
            document.getElementById('cliente').disabled = ehNovo;
        };

        function limparForm() {
            itens = []; renderItens();
            document.getElementById('cliente').value = "";
            document.getElementById('novo-cliente-check').checked = false;
            ['nc-atendente', 'nc-empresa', 'nc-whatsapp'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('bloco-novo-cliente').classList.add('hidden');
            document.getElementById('cliente').disabled = false;
        }

        window.enviarParaCliente = async () => {
            const select = document.getElementById('cliente');
            const ehNovo = document.getElementById('novo-cliente-check').checked;
            if (itens.length === 0) { alert("Adicione pelo menos um item ao relatório."); return; }

            let clienteId = null, clienteNome = "", novoCliente = null;
            if (ehNovo) {
                const atendente = document.getElementById('nc-atendente').value.trim();
                const empresa = document.getElementById('nc-empresa').value.trim();
                const whatsapp = document.getElementById('nc-whatsapp').value.trim();
                if (!empresa) { alert("Informe o nome da empresa do cliente."); return; }
                novoCliente = { atendente, empresa, whatsapp };
                clienteNome = empresa + (atendente ? " (" + atendente + ")" : "");
            } else {
                clienteId = select.value;
                if (!clienteId) { alert("Selecione o cliente ou marque 'Cliente não cadastrado'."); return; }
                clienteNome = select.options[select.selectedIndex].text;
            }

            const btn = document.getElementById('btn-enviar');
            btn.disabled = true; btn.innerText = "Enviando...";
            try {
                const relatorio = {
                    tipo: "vistoria", funcionario: nomeFuncionario, clienteNome,
                    novoCliente: novoCliente || null,
                    itens: itens.map(it => ({ descricao: it.descricao, fotoAntes: it.foto || "" })),
                    data: new Date().toISOString()
                };
                // Dispara as gravações (ficam salvas no aparelho mesmo offline)
                const promessas = [];
                if (clienteId) {
                    // Cliente cadastrado: envia para o painel dele
                    for (const it of itens) {
                        promessas.push(addDoc(collection(db, "usuarios", clienteId, "itens_resolver"), {
                            descricao: it.descricao, fotoAntes: it.foto || "", status: "pendente",
                            fotoDepois: "", funcionario: nomeFuncionario, data: new Date().toISOString()
                        }));
                    }
                    promessas.push(addDoc(collection(db, "usuarios", clienteId, "relatorios"), relatorio));
                }
                // Histórico do funcionário (sempre)
                promessas.push(addDoc(collection(db, "usuarios", usuarioAtual.uid, "relatorios_enviados"), { ...relatorio, clienteId: clienteId || "" }));

                const pdf = gerarPDF(clienteNome, itens);
                await compartilharPDF(pdf, "relatorio-vistoria.pdf", `Relatório de vistoria - ${clienteNome}`);

                if (!navigator.onLine) {
                    alert("Sem internet: o relatório foi salvo no seu aparelho e será enviado automaticamente quando a conexão voltar. Pode fechar o app tranquilo.");
                    limparForm(); return;
                }

                await Promise.all(promessas);
                await enviarEmailAdmin(clienteNome, itens, novoCliente);
                alert("Relatório enviado com sucesso!" + (novoCliente ? "\nO administrador foi avisado do novo cliente." : ""));
                limparForm();
            } catch (err) {
                alert("Erro ao enviar: " + err.message);
            } finally { btn.disabled = false; btn.innerText = "Enviar relatório ao cliente"; }
        };
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col justify-between p-6 overflow-hidden">
        <div id="conteudo" class="hidden overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <a href="relatorios.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-lg font-black text-blue-950">Relatório de Vistoria</h1>
                <div class="w-8"></div>
            </div>

            <label class="text-xs font-semibold text-slate-600">Cliente visitado</label>
            <select id="cliente" class="w-full mt-1 mb-1 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Selecione o cliente</option>
            </select>
            <p id="aviso-clientes" class="text-[11px] text-slate-400 mb-1"></p>

            <label class="flex items-center gap-2 text-xs font-semibold text-amber-700 mb-2 cursor-pointer">
                <input type="checkbox" id="novo-cliente-check" onchange="toggleNovoCliente()" class="w-4 h-4 accent-amber-500"> Cliente não cadastrado
            </label>
            <div id="bloco-novo-cliente" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-2 mb-3">
                <input id="nc-atendente" placeholder="Nome de quem atendeu" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-400">
                <input id="nc-empresa" placeholder="Nome da empresa" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-400">
                <input id="nc-whatsapp" type="tel" placeholder="WhatsApp do cliente" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-400">
                <p class="text-[10px] text-amber-700">Este cliente não fica salvo. O administrador recebe um e-mail avisando do novo contato.</p>
            </div>

            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 space-y-2 mb-3">
                <label class="text-xs font-semibold text-slate-600">Novo item</label>
                <textarea id="descricao" rows="2" placeholder="Anotação (o que você observou neste item)" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <input type="file" id="foto" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 file:font-semibold">
                <button type="button" id="btn-add" onclick="adicionarItem()" class="w-full bg-slate-100 text-slate-700 font-bold py-2 rounded-lg text-sm hover:bg-slate-200 transition">+ Adicionar item</button>
            </div>

            <h2 class="text-sm font-bold text-slate-700 mb-2">Itens do relatório (<span id="contador">0</span>)</h2>
            <div id="lista-itens" class="space-y-2 mb-4"></div>

            <button type="button" id="btn-enviar" onclick="enviarParaCliente()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-blue-700 transition">Enviar relatório ao cliente</button>
            <p class="text-[11px] text-slate-400 mt-2 text-center">Ao enviar: vai ao cliente, gera PDF para WhatsApp e avisa o administrador por e-mail.</p>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="configuracoes.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></a>
            <a href="perfil.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
