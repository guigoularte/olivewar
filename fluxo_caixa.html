<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Fluxo de Caixa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="oliver_ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="oliver_pdf.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, getDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioAtual = null;   // quem está logado
        let alvoUid = null;        // de quem são os dados exibidos
        let somenteLeitura = false;
        let todas = [];            // todos os lançamentos carregados
        let nomeAlvo = "";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            usuarioAtual = user;
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const dd = snap.exists() ? snap.data() : {}; const fx = dd.funcionalidades || {};
            const ehMaster = dd.role === "master";

            // Modo master: ?uid=... para ver os dados de outro usuário
            const params = new URLSearchParams(location.search);
            const uidParam = params.get("uid");
            if (uidParam && ehMaster && uidParam !== user.uid) {
                alvoUid = uidParam; somenteLeitura = true;
                const alvoSnap = await getDoc(doc(db, "usuarios", uidParam));
                nomeAlvo = alvoSnap.exists() ? (alvoSnap.data().nome || alvoSnap.data().email || "usuário") : "usuário";
                document.getElementById('banner-master').classList.remove('hidden');
                document.getElementById('nome-alvo').innerText = nomeAlvo;
                document.getElementById('form').style.display = "none";
            } else {
                alvoUid = user.uid;
                const ok = ehMaster || (('fluxoCaixa' in fx) ? fx.fluxoCaixa : true);
                if (!ok) { alert("Esta funcionalidade não está disponível no seu plano."); window.location.href = "app.html"; return; }
            }

            document.getElementById('data').value = new Date().toISOString().slice(0, 10);
            document.getElementById('filtro-mes').value = new Date().toISOString().slice(0, 7);
            carregar();
            carregarProdutos();
        });

        const brl = (n) => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const num = (v) => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };

        // Carrega produtos cadastrados (Produtos/Serviços + Cálculo de Margem) para venda rápida
        async function carregarProdutos() {
            const sel = document.getElementById('produto-select');
            if (!sel) return;
            const itens = [];
            try {
                const ps = await getDocs(collection(db, "usuarios", alvoUid, "produtos"));
                ps.forEach(d => { const p = d.data(); if (p.nome) itens.push({ nome: p.nome, preco: num(p.preco) }); });
                const ms = await getDocs(collection(db, "usuarios", alvoUid, "margens"));
                ms.forEach(d => { const m = d.data(); if (m.nomeProduto) itens.push({ nome: m.nomeProduto, preco: num(m.precoVenda) }); });
            } catch (e) { console.error(e); }
            itens.sort((a, b) => a.nome.localeCompare(b.nome));
            itens.forEach(it => {
                const o = document.createElement('option');
                o.value = JSON.stringify(it);
                o.textContent = `${it.nome} — ${brl(it.preco)}`;
                sel.appendChild(o);
            });
        }

        // Ao escolher um produto, preenche como entrada (venda)
        window.selecionarProduto = (el) => {
            if (!el.value) return;
            const it = JSON.parse(el.value);
            document.getElementById('tipo').value = "entrada";
            document.getElementById('descricao').value = it.nome;
            document.getElementById('valor').value = it.preco;
            document.getElementById('categoria').value = "Vendas";
        };

        window.toggleContaPagar = () => {
            const cp = document.getElementById('conta-pagar-check').checked;
            document.getElementById('bloco-vencimento').classList.toggle('hidden', !cp);
            const tipo = document.getElementById('tipo');
            if (cp) { tipo.value = "saida"; tipo.disabled = true; } else { tipo.disabled = false; }
        };

        window.salvar = async (e) => {
            e.preventDefault();
            const contaPagar = document.getElementById('conta-pagar-check').checked;
            const mov = {
                tipo: contaPagar ? "saida" : document.getElementById('tipo').value,
                descricao: document.getElementById('descricao').value.trim(),
                valor: num(document.getElementById('valor').value),
                categoria: document.getElementById('categoria').value.trim(),
                forma: document.getElementById('forma').value,
                data: document.getElementById('data').value || new Date().toISOString().slice(0, 10),
                criadoEm: new Date().toISOString(),
                status: contaPagar ? "a_pagar" : "pago"
            };
            if (contaPagar) mov.vencimento = document.getElementById('vencimento').value || mov.data;
            if (!mov.descricao || mov.valor <= 0) { alert("Preencha a descrição e um valor maior que zero."); return; }
            if (contaPagar && !document.getElementById('vencimento').value) { alert("Informe a data de vencimento da conta a pagar."); return; }
            try {
                await addDoc(collection(db, "usuarios", alvoUid, "fluxo_caixa"), mov);
                document.getElementById('form').reset();
                document.getElementById('data').value = new Date().toISOString().slice(0, 10);
                document.getElementById('tipo').disabled = false;
                document.getElementById('bloco-vencimento').classList.add('hidden');
                carregar();
            } catch (err) { alert("Erro ao salvar: " + err.message); }
        };

        // Marca uma conta a pagar como paga (entra no caixa na data de hoje)
        window.marcarPago = async (id) => {
            if (!confirm("Marcar como PAGO hoje? O valor entra no fluxo de caixa.")) return;
            await updateDoc(doc(db, "usuarios", alvoUid, "fluxo_caixa", id), { status: "pago", data: new Date().toISOString().slice(0, 10) });
            carregar();
        };

        window.excluir = async (id) => {
            if (!confirm("Excluir este lançamento?")) return;
            await deleteDoc(doc(db, "usuarios", alvoUid, "fluxo_caixa", id));
            carregar();
        };

        async function carregar() {
            const snap = await getDocs(collection(db, "usuarios", alvoUid, "fluxo_caixa"));
            todas = [];
            snap.forEach((d) => todas.push({ id: d.id, ...d.data() }));
            render();
        }

        function filtradas() {
            const mes = document.getElementById('filtro-mes').value;   // AAAA-MM ou ""
            const tipo = document.getElementById('filtro-tipo').value; // "", entrada, saida
            return todas
                .filter(m => m.status !== "a_pagar")   // só o caixa realizado
                .filter(m => !mes || (m.data || "").startsWith(mes))
                .filter(m => !tipo || m.tipo === tipo)
                .sort((a, b) => (b.data || "").localeCompare(a.data || "") || (b.criadoEm || "").localeCompare(a.criadoEm || ""));
        }

        window.render = () => {
            const movs = filtradas();
            let entradas = 0, saidas = 0;
            movs.forEach((m) => { if (m.tipo === "entrada") entradas += m.valor; else saidas += m.valor; });
            const saldo = entradas - saidas;

            document.getElementById('tot-entradas').innerText = brl(entradas);
            document.getElementById('tot-saidas').innerText = brl(saidas);
            const elSaldo = document.getElementById('tot-saldo');
            elSaldo.innerText = brl(saldo);
            elSaldo.className = "font-black text-[13px] " + (saldo >= 0 ? "text-green-300" : "text-red-300");

            // Contas a pagar (pendentes) — mostradas sempre, ordenadas por vencimento
            const hoje = new Date().toISOString().slice(0, 10);
            const pendentes = todas.filter(m => m.status === "a_pagar")
                .sort((a, b) => (a.vencimento || "").localeCompare(b.vencimento || ""));
            const totalPagar = pendentes.reduce((s, m) => s + m.valor, 0);
            const bloco = document.getElementById('bloco-pagar');
            document.getElementById('tot-pagar').innerText = brl(totalPagar);
            const listaPagar = document.getElementById('lista-pagar');
            if (pendentes.length === 0) { bloco.style.display = "none"; }
            else {
                bloco.style.display = "block";
                listaPagar.innerHTML = pendentes.map(m => {
                    const vencFmt = m.vencimento ? m.vencimento.split("-").reverse().join("/") : "";
                    const vencida = m.vencimento && m.vencimento < hoje;
                    return `<div class="flex items-center justify-between gap-2 bg-white rounded-lg border ${vencida ? 'border-red-300' : 'border-slate-200'} px-2.5 py-2 text-sm">
                        <div class="min-w-0">
                            <div class="font-semibold text-slate-800 text-[13px] truncate">${m.descricao}</div>
                            <div class="text-[10px] ${vencida ? 'text-red-600 font-bold' : 'text-slate-400'}">Vence ${vencFmt}${vencida ? ' · VENCIDA' : ''}${m.categoria ? ' · ' + m.categoria : ''}</div>
                        </div>
                        <div class="text-right whitespace-nowrap font-bold text-red-600 text-[13px]">${brl(m.valor)}</div>
                        ${somenteLeitura ? '' : `<div class="flex flex-col gap-1">
                            <button onclick="marcarPago('${m.id}')" class="bg-green-600 text-white text-[10px] font-bold px-2 py-1 rounded">✓ Pagar</button>
                            <button onclick="excluir('${m.id}')" class="text-slate-300 hover:text-red-500 text-[10px]">excluir</button>
                        </div>`}
                    </div>`;
                }).join('');
            }

            const tbody = document.getElementById('tabela');
            tbody.innerHTML = '';
            if (movs.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="text-center text-slate-400 text-xs py-6">Nenhum lançamento no período.</td></tr>'; return; }
            movs.forEach((m) => {
                const entrada = m.tipo === "entrada";
                const dataFmt = m.data ? m.data.split("-").reverse().join("/") : "";
                tbody.innerHTML += `<tr class="border-b border-slate-100 align-top">
                    <td class="py-2 pr-2">
                        <div class="font-semibold text-slate-800 text-[13px]">${m.descricao}</div>
                        <div class="text-[10px] text-slate-400">${dataFmt}${m.categoria ? " · " + m.categoria : ""}${m.forma ? " · " + m.forma : ""}</div>
                    </td>
                    <td class="py-2 text-right whitespace-nowrap font-bold text-[13px] ${entrada ? 'text-green-600' : 'text-red-600'}">${entrada ? '+' : '-'} ${brl(m.valor)}</td>
                    <td class="py-2 pl-2 text-right">${somenteLeitura ? '' : `<button onclick="excluir('${m.id}')" class="text-slate-300 hover:text-red-500 text-xs">✕</button>`}</td>
                </tr>`;
            });
        };

        // Exportar CSV (abre no Excel)
        window.exportarCSV = () => {
            const movs = filtradas();
            if (movs.length === 0) { alert("Nada para exportar neste período."); return; }
            const linhas = [["Data", "Tipo", "Descrição", "Categoria", "Forma", "Valor"]];
            movs.forEach(m => linhas.push([
                m.data ? m.data.split("-").reverse().join("/") : "",
                m.tipo === "entrada" ? "Entrada" : "Saída",
                m.descricao || "", m.categoria || "", m.forma || "",
                Number(m.valor || 0).toFixed(2).replace(".", ",")
            ]));
            const csv = "﻿" + linhas.map(l => l.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "fluxo-caixa.csv";
            a.click();
        };

        // Exportar PDF
        window.exportarPDF = () => {
            const movs = filtradas();
            if (movs.length === 0) { alert("Nada para exportar neste período."); return; }
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            let ent = 0, sai = 0; movs.forEach(m => m.tipo === "entrada" ? ent += m.valor : sai += m.valor);
            let y = oliverPdfHeader(pdf, "Fluxo de Caixa", nomeAlvo || "");
            pdf.setFontSize(10); pdf.setTextColor(0, 0, 0);
            const mes = document.getElementById('filtro-mes').value;
            pdf.text(`Período: ${mes ? mes.split("-").reverse().join("/") : "Todos"}`, 14, y); y += 5;
            pdf.text(`Entradas: ${brl(ent)}  |  Saídas: ${brl(sai)}  |  Saldo: ${brl(ent - sai)}`, 14, y); y += 8;
            pdf.setFontSize(9);
            pdf.setFont(undefined, "bold");
            pdf.text("Data", 14, y); pdf.text("Descrição", 38, y); pdf.text("Categoria", 110, y); pdf.text("Valor", 175, y);
            pdf.setFont(undefined, "normal"); pdf.setDrawColor(200); pdf.line(14, y + 1.5, 196, y + 1.5); y += 6;
            movs.forEach(m => {
                if (y > 285) { pdf.addPage(); y = 18; }
                const entrada = m.tipo === "entrada";
                pdf.setTextColor(60, 60, 60);
                pdf.text(m.data ? m.data.split("-").reverse().join("/") : "", 14, y);
                pdf.text(pdf.splitTextToSize(m.descricao || "", 68), 38, y);
                pdf.text(pdf.splitTextToSize(m.categoria || "", 60), 110, y);
                pdf.setTextColor(entrada ? 20 : 200, entrada ? 130 : 0, entrada ? 60 : 0);
                pdf.text(`${entrada ? '+' : '-'} ${brl(m.valor)}`, 175, y);
                y += 7;
            });
            oliverPdfFooter(pdf);
            pdf.save("fluxo-caixa.pdf");
        };
    </script>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-400 to-amber-400 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#FCFAF4] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-blue-950 flex flex-col justify-between p-6 overflow-hidden">
        <div class="overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <a href="app.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-lg font-black text-blue-950">Fluxo de Caixa</h1>
                <div class="w-8"></div>
            </div>

            <div id="banner-master" class="hidden bg-purple-100 text-purple-800 text-xs font-semibold rounded-xl px-3 py-2 mb-3 text-center">
                👁 Visualizando dados de <span id="nome-alvo"></span> (somente leitura)
            </div>

            <!-- Resumo -->
            <div class="bg-blue-950 text-white p-4 rounded-2xl grid grid-cols-3 gap-2 text-center mb-3">
                <div><div class="text-[10px] uppercase tracking-wide text-blue-200">Entradas</div><div id="tot-entradas" class="font-bold text-green-300 text-[13px]">R$ 0,00</div></div>
                <div><div class="text-[10px] uppercase tracking-wide text-blue-200">Saídas</div><div id="tot-saidas" class="font-bold text-red-300 text-[13px]">R$ 0,00</div></div>
                <div><div class="text-[10px] uppercase tracking-wide text-blue-200">Saldo</div><div id="tot-saldo" class="font-black text-[13px]">R$ 0,00</div></div>
            </div>

            <!-- Filtros e exportação -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 mb-3">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="month" id="filtro-mes" onchange="render()" class="p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="filtro-tipo" onchange="render()" class="p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Todos os tipos</option>
                        <option value="entrada">Só entradas</option>
                        <option value="saida">Só saídas</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="document.getElementById('filtro-mes').value='';render()" class="flex-1 bg-slate-100 text-slate-600 text-xs font-semibold py-1.5 rounded-lg hover:bg-slate-200">Ver tudo</button>
                    <button type="button" onclick="exportarCSV()" class="flex-1 bg-emerald-50 text-emerald-700 text-xs font-semibold py-1.5 rounded-lg hover:bg-emerald-100">⬇ CSV</button>
                    <button type="button" onclick="exportarPDF()" class="flex-1 bg-blue-50 text-blue-700 text-xs font-semibold py-1.5 rounded-lg hover:bg-blue-100">📄 PDF</button>
                </div>
            </div>

            <!-- Formulário -->
            <form id="form" onsubmit="salvar(event)" class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 space-y-2 mb-4">
                <div class="grid grid-cols-2 gap-2">
                    <select id="tipo" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="entrada" selected>Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                    <input type="date" id="data" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <select id="produto-select" onchange="selecionarProduto(this)" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-emerald-50 text-emerald-800">
                    <option value="">🛒 Venda rápida: escolher produto cadastrado</option>
                </select>
                <input type="text" id="descricao" placeholder="Descrição" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" step="any" id="valor" placeholder="Valor R$" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
                    <input type="text" id="categoria" list="categorias" placeholder="Categoria" class="p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <datalist id="categorias">
                        <option>Fornecedor</option><option>Aluguel</option><option>Salários</option>
                        <option>Impostos</option><option>Energia/Água</option><option>Vendas</option>
                        <option>Serviços</option><option>Outros</option>
                    </datalist>
                </div>
                <select id="forma" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Forma de pagamento</option>
                    <option>Dinheiro</option><option>PIX</option><option>Cartão de crédito</option>
                    <option>Cartão de débito</option><option>Boleto</option><option>Transferência</option><option>Outro</option>
                </select>

                <label class="flex items-center gap-2 text-xs font-semibold text-red-700 cursor-pointer">
                    <input type="checkbox" id="conta-pagar-check" onchange="toggleContaPagar()" class="w-4 h-4 accent-red-500"> Conta a pagar (compra que vou pagar depois)
                </label>
                <div id="bloco-vencimento" class="hidden">
                    <label class="text-[10px] text-slate-500">Data de vencimento</label>
                    <input type="date" id="vencimento" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-red-400">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition">Registrar lançamento</button>
            </form>

            <!-- Contas a pagar (pendentes) -->
            <div id="bloco-pagar" style="display:none" class="mb-4">
                <h2 class="text-sm font-bold text-red-700 mb-1">📌 Contas a pagar (<span id="tot-pagar">R$ 0,00</span>)</h2>
                <div id="lista-pagar" class="space-y-1"></div>
            </div>

            <!-- Tabela -->
            <h2 class="text-sm font-bold text-slate-700 mb-2">Movimentações</h2>
            <table class="w-full text-sm mb-2"><tbody id="tabela"></tbody></table>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="configuracoes.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></a>
            <a href="perfil.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
