<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAa24q8CNHHtVZxX7_ooVtCmvxGu2IGykY", authDomain: "olivewar-1e5e2.firebaseapp.com", projectId: "olivewar-1e5e2", storageBucket: "olivewar-1e5e2.firebasestorage.app", messagingSenderId: "437889793363", appId: "1:437889793363:web:508e445177eb06f6e435a6", measurementId: "G-GGB4C2X6TL" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioAtual = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            usuarioAtual = user;

            // Carrega os dados atuais do perfil
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            const d = snap.exists() ? snap.data() : {};
            document.getElementById('nome').value = d.nome || '';
            document.getElementById('telefone').value = d.telefone || '';
            document.getElementById('segmento').value = d.segmento || '';
            document.getElementById('faturamento').value = d.faturamento || '';
            document.getElementById('cep').value = d.cep || '';
            document.getElementById('cidade').value = d.cidade || '';
            document.getElementById('estado').value = d.estado || '';
            document.getElementById('email').innerText = user.email || '';
        });

        window.salvarPerfil = async (e) => {
            e.preventDefault();
            try {
                // merge:true preserva campos existentes (como role) sem apagar
                await setDoc(doc(db, "usuarios", usuarioAtual.uid), {
                    nome: document.getElementById('nome').value,
                    telefone: document.getElementById('telefone').value,
                    segmento: document.getElementById('segmento').value,
                    faturamento: document.getElementById('faturamento').value,
                    cep: document.getElementById('cep').value,
                    cidade: document.getElementById('cidade').value,
                    estado: document.getElementById('estado').value
                }, { merge: true });
                alert("Perfil atualizado com sucesso!");
                window.location.href = "app.html";
            } catch (err) {
                alert("Erro ao salvar: " + err.message);
            }
        };
    </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-none sm:max-w-sm bg-[#f4f7fb] min-h-[100dvh] sm:min-h-[700px] sm:rounded-[40px] shadow-2xl sm:border-4 border-slate-300 flex flex-col justify-between p-6 overflow-hidden">
        <div class="overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <a href="app.html" class="text-blue-900 font-bold text-sm">← Voltar</a>
                <h1 class="text-lg font-black text-blue-950">Meu Perfil</h1>
                <div class="w-8"></div>
            </div>

            <p class="text-xs text-slate-500 mb-1">E-mail (não editável)</p>
            <p id="email" class="text-sm font-semibold text-slate-700 bg-slate-100 rounded-xl px-4 py-2.5 mb-4">—</p>

            <form onsubmit="salvarPerfil(event)" class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-slate-600">Nome completo</label>
                    <input type="text" id="nome" placeholder="Nome completo" class="w-full mt-1 px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">Telefone (WhatsApp)</label>
                    <input type="tel" id="telefone" placeholder="Telefone ativo" class="w-full mt-1 px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">Segmento da empresa</label>
                    <input type="text" id="segmento" placeholder="Ex: Lanchonete" class="w-full mt-1 px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">Faturamento médio mensal</label>
                    <select id="faturamento" class="w-full mt-1 px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                        <option value="">Selecione</option>
                        <option value="Até R$ 5.000">Até R$ 5.000</option>
                        <option value="R$ 5.000 a R$ 20.000">R$ 5.000 a R$ 20.000</option>
                        <option value="R$ 20.000 a R$ 50.000">R$ 20.000 a R$ 50.000</option>
                        <option value="R$ 50.000 a R$ 100.000">R$ 50.000 a R$ 100.000</option>
                        <option value="Acima de R$ 100.000">Acima de R$ 100.000</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">CEP</label>
                    <input type="text" id="cep" placeholder="CEP" class="w-full mt-1 px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-xs font-semibold text-slate-600">Cidade</label>
                        <input type="text" id="cidade" placeholder="Cidade" class="w-full mt-1 px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                    </div>
                    <div class="w-24">
                        <label class="text-xs font-semibold text-slate-600">Estado</label>
                        <select id="estado" class="w-full mt-1 px-3 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                            <option value="">UF</option>
                            <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-2xl text-sm hover:bg-blue-700 transition shadow-lg">Salvar alterações</button>
            </form>
        </div>

        <div class="bg-white border-t border-slate-200 -mx-6 -mb-6 px-8 py-4 flex justify-around items-center">
            <a href="app.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
            <a href="configuracoes.html" class="text-slate-400 hover:text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></a>
            <a href="perfil.html" class="text-blue-900"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
        </div>
    </div>
</body>
</html>
